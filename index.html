<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imatges</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1120px;
            margin: 40px auto;
            padding: 0 20px;
            text-align: center;
            color: #212529;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-bottom: 30px;
        }
        .header img {
            height: 48px;
            border-radius: 8px;
        }
        .header h1 {
            margin: 0;
            font-size: 32px;
        }
        .hub-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            align-items: stretch;
        }
        .hub-card {
            flex: 1;
            min-width: 300px;
            max-width: 420px;
            background: #f8f9fa;
            border: 1px solid #ced4da;
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .hub-card h2 {
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 20px;
        }
        .hub-card p {
            font-size: 14px;
            color: #6c757d;
            margin-bottom: 15px;
        }
        .preview-box {
            background: #ffffff;
            border: 2px dashed #ccc;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 15px;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas {
            width: 300px;
            height: 180px;
            max-width: 100%;
            display: block;
        }
        .checker-bg {
            background-image: 
                linear-gradient(45deg, #e9ecef 25%, transparent 25%), 
                linear-gradient(-45deg, #e9ecef 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #e9ecef 75%), 
                linear-gradient(-45deg, transparent 75%, #e9ecef 75%);
            background-size: 16px 16px;
            background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
        }
        .hub-btn {
            display: block;
            padding: 10px;
            font-size: 15px;
            text-decoration: none;
            background-color: #28a745;
            color: white;
            border-radius: 5px;
            font-weight: bold;
        }
        .hub-btn:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <div class="header">
        <img src="logo.png" alt="Logo">
        <h1>Imatges</h1>
    </div>

    <div class="hub-container">
        <!-- Card 1: Marca de Agua -->
        <div class="hub-card">
            <div>
                <h2>Marca d'Aigua</h2>
                <p>Añade texto o marcas de agua en lote a tus imágenes.</p>
                <div class="preview-box">
                    <canvas id="wmPreview" width="300" height="180"></canvas>
                </div>
            </div>
            <a href="marca-de-agua.html" class="hub-btn">Abrir</a>
        </div>

        <!-- Card 2: Quitar Fondo -->
        <div class="hub-card">
            <div>
                <h2>Quitar Fondo</h2>
                <p>Quita el fondo a tus imágenes en lote manteniendo la resolución original.</p>
                <div class="preview-box checker-bg">
                    <canvas id="bgPreview" width="300" height="180"></canvas>
                </div>
            </div>
            <a href="quitar-fondo.html" class="hub-btn">Abrir</a>
        </div>

        <!-- Card 3: Convertir Formatos -->
        <div class="hub-card">
            <div>
                <h2>Convertir Formatos</h2>
                <p>Convierte imágenes en lote a PNG, JPG, WEBP, ICO, GIF, BMP, TIFF, TGA, AVIF, SVG o PDF.</p>
                <div class="preview-box">
                    <canvas id="convertPreview" width="300" height="180"></canvas>
                </div>
            </div>
            <a href="convertir.html" class="hub-btn">Abrir</a>
        </div>
    </div>

    <script>
        function setupHiDPICanvas(canvas, logicalW, logicalH) {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = logicalW * dpr;
            canvas.height = logicalH * dpr;
            const ctx = canvas.getContext('2d');
            ctx.scale(dpr, dpr);
            return ctx;
        }

        const w = 300;
        const h = 180;

        // Preview 1: Marca de Agua
        const wmCanvas = document.getElementById('wmPreview');
        const wmCtx = setupHiDPICanvas(wmCanvas, w, h);

        const grad = wmCtx.createLinearGradient(0, 0, w, h);
        grad.addColorStop(0, '#3a7bd5');
        grad.addColorStop(1, '#3a6073');
        wmCtx.fillStyle = grad;
        wmCtx.fillRect(0, 0, w, h);

        wmCtx.fillStyle = '#2c3e50';
        wmCtx.beginPath();
        wmCtx.moveTo(0, h);
        wmCtx.lineTo(w * 0.4, h * 0.45);
        wmCtx.lineTo(w * 0.7, h);
        wmCtx.fill();

        wmCtx.save();
        wmCtx.font = 'bold 22px Arial, sans-serif';
        wmCtx.fillStyle = '#ffffff';
        wmCtx.globalAlpha = 0.55;
        wmCtx.textAlign = 'center';
        wmCtx.textBaseline = 'middle';
        wmCtx.translate(w / 2, h / 2);
        wmCtx.rotate(-0.15);
        wmCtx.fillText('© Mi Marca', 0, 0);
        wmCtx.restore();

        // Preview 2: Quitar Fondo (Split Antes / Después)
        const bgCanvas = document.getElementById('bgPreview');
        const bgCtx = setupHiDPICanvas(bgCanvas, w, h);
        bgCtx.clearRect(0, 0, w, h);

        // Left half: original background
        bgCtx.save();
        bgCtx.beginPath();
        bgCtx.rect(0, 0, w / 2, h);
        bgCtx.clip();
        const bgGrad = bgCtx.createLinearGradient(0, 0, w, h);
        bgGrad.addColorStop(0, '#60a5fa');
        bgGrad.addColorStop(1, '#3b82f6');
        bgCtx.fillStyle = bgGrad;
        bgCtx.fillRect(0, 0, w / 2, h);
        bgCtx.restore();

        // Subject silhouette across the center
        bgCtx.fillStyle = '#343a40';
        bgCtx.beginPath();
        bgCtx.arc(w / 2, h * 0.35, 32, 0, Math.PI * 2);
        bgCtx.fill();

        bgCtx.beginPath();
        bgCtx.moveTo(w / 2 - 50, h);
        bgCtx.quadraticCurveTo(w / 2 - 40, h * 0.58, w / 2 - 25, h * 0.55);
        bgCtx.lineTo(w / 2 + 25, h * 0.55);
        bgCtx.quadraticCurveTo(w / 2 + 40, h * 0.58, w / 2 + 50, h);
        bgCtx.closePath();
        bgCtx.fill();

        // Split line
        bgCtx.strokeStyle = '#ffffff';
        bgCtx.lineWidth = 2;
        bgCtx.beginPath();
        bgCtx.moveTo(w / 2, 0);
        bgCtx.lineTo(w / 2, h);
        bgCtx.stroke();

        // Preview 3: Convertir Formatos
        const cvCanvas = document.getElementById('convertPreview');
        const cvCtx = setupHiDPICanvas(cvCanvas, w, h);

        cvCtx.fillStyle = '#f1f3f5';
        cvCtx.fillRect(0, 0, w, h);

        const formats = ['PNG', 'ICO', 'GIF', 'WEBP', 'BMP', 'PDF'];
        const colors = ['#007bff', '#28a745', '#6f42c1', '#fd7e14', '#17a2b8', '#dc3545'];
        const cols = 3;
        const boxW = 72;
        const boxH = 44;
        const gap = 14;
        const startX = (w - (cols * boxW + (cols - 1) * gap)) / 2;
        const startY = (h - (2 * boxH + gap)) / 2;

        formats.forEach((fmt, idx) => {
            const col = idx % cols;
            const row = Math.floor(idx / cols);
            const x = startX + col * (boxW + gap);
            const y = startY + row * (boxH + gap);

            cvCtx.fillStyle = '#ffffff';
            cvCtx.strokeStyle = '#ced4da';
            cvCtx.lineWidth = 1;
            cvCtx.fillRect(x, y, boxW, boxH);
            cvCtx.strokeRect(x, y, boxW, boxH);

            cvCtx.fillStyle = colors[idx];
            cvCtx.fillRect(x, y, boxW, 6);

            cvCtx.fillStyle = '#212529';
            cvCtx.font = 'bold 13px Arial, sans-serif';
            cvCtx.textAlign = 'center';
            cvCtx.textBaseline = 'middle';
            cvCtx.fillText('.' + fmt, x + boxW / 2, y + boxH / 2 + 3);
        });
    </script>
</body>
</html>
