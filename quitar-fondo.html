<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quitar Fondo en Lote</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 20px auto;
            padding: 0 20px;
            text-align: center;
        }
        .header-title {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 15px;
        }
        .header-title img {
            height: 38px;
            border-radius: 6px;
        }
        .header-title h1 {
            margin: 0;
        }
        .paste-notice {
            background-color: #e9ecef;
            border: 2px dashed #6c757d;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
            color: #495057;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            align-items: flex-start;
        }
        .controls {
            flex: 1;
            min-width: 290px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-align: left;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .quick-btn-group {
            display: flex;
            gap: 5px;
            margin-top: 4px;
        }
        .quick-btn-group button {
            padding: 2px 6px;
            font-size: 12px;
            background-color: #6c757d;
        }
        .hidden {
            display: none !important;
        }
        .preview-area {
            flex: 2;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .canvas-wrap {
            position: relative;
            background-image: 
                linear-gradient(45deg, #e9ecef 25%, transparent 25%), 
                linear-gradient(-45deg, #e9ecef 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #e9ecef 75%), 
                linear-gradient(-45deg, transparent 75%, #e9ecef 75%);
            background-size: 16px 16px;
            background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
            border: 2px dashed #ccc;
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas {
            max-width: 100%;
            height: auto;
            display: block;
        }
        #brushCursor {
            position: absolute;
            border: 2px solid #007bff;
            background: rgba(0, 123, 255, 0.15);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            display: none;
        }
        .gallery {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 10px 0;
            min-height: 90px;
            align-items: center;
        }
        .thumb-wrapper {
            position: relative;
            display: inline-block;
            flex-shrink: 0;
        }
        .gallery img {
            height: 70px;
            border: 2px solid transparent;
            border-radius: 4px;
            cursor: pointer;
            object-fit: cover;
            display: block;
            background: #fff;
        }
        .gallery img.active {
            border-color: #007bff;
        }
        .delete-thumb-btn {
            position: absolute;
            top: -6px;
            right: -6px;
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 12px;
            line-height: 18px;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            box-shadow: 0px 2px 4px rgba(0,0,0,0.3);
        }
        .delete-thumb-btn:hover {
            background-color: #bd2130;
        }
        .delete-current-btn {
            background-color: #dc3545;
            margin-top: 5px;
        }
        .delete-current-btn:hover {
            background-color: #bd2130;
        }
        .clear-all-btn {
            background-color: #6c757d;
            margin-top: 5px;
        }
        .clear-all-btn:hover {
            background-color: #5a6268;
        }
        button {
            padding: 10px;
            font-size: 15px;
            cursor: pointer;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        .status-text {
            font-size: 13px;
            color: #495057;
            padding: 6px;
            background: #e9ecef;
            border-radius: 4px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="header-title">
        <img src="logo.png" alt="Logo">
        <h1>Quitar Fondo en Lote</h1>
    </div>

    <div class="paste-notice">
        📌 <strong>Tip:</strong> Presiona <strong>Ctrl + V</strong> (o Cmd + V) para pegar imágenes desde el portapapeles.
    </div>

    <div class="container">
        <div class="controls">
            <div class="control-group">
                <label for="imgInput">Seleccionar Imágenes:</label>
                <input type="file" id="imgInput" accept="image/*" multiple>
            </div>

            <div class="status-text" id="statusLabel">Listo para procesar</div>

            <div class="control-group">
                <label for="bgType">Tipo de Fondo:</label>
                <select id="bgType">
                    <option value="transparent">Transparente</option>
                    <option value="color">Color Sólido</option>
                    <option value="image">Imagen Personalizada</option>
                    <option value="blur">Desenfocar Fondo Original</option>
                </select>
            </div>

            <div class="control-group hidden" id="colorGroup">
                <label for="bgColor">Color de Fondo:</label>
                <input type="color" id="bgColor" value="#ffffff" style="height: 38px; width: 100%;">
            </div>

            <div class="control-group hidden" id="customBgGroup">
                <label for="customBgInput">Subir Imagen de Fondo:</label>
                <input type="file" id="customBgInput" accept="image/*">
            </div>

            <div class="control-group hidden" id="blurGroup">
                <label for="blurAmount">Nivel de Desenfocado: <strong id="blurVal">12px</strong></label>
                <input type="range" id="blurAmount" min="2" max="30" value="12">
            </div>

            <div class="control-group">
                <label style="cursor: pointer;">
                    <input type="checkbox" id="brushToggle"> <strong>Pincel de Retoque</strong>
                </label>
            </div>

            <div class="control-group hidden" id="brushControls">
                <div class="quick-btn-group">
                    <button type="button" id="btnErase" style="background-color: #dc3545; flex: 1;">Borrar</button>
                    <button type="button" id="btnRestore" style="background-color: #6c757d; flex: 1;">Restaurar</button>
                </div>
                <label for="brushSize" style="margin-top: 6px;">Tamaño del Pincel: <strong id="brushSizeVal">25px</strong></label>
                <input type="range" id="brushSize" min="5" max="80" value="25">
                <button type="button" id="btnResetMask" style="background-color: #6c757d; font-size: 12px; padding: 4px; margin-top: 4px;">Reiniciar Máscara</button>
            </div>

            <div class="control-group">
                <label for="exportFormat">Formato de Descarga:</label>
                <select id="exportFormat">
                    <option value="image/png">PNG (.png)</option>
                    <option value="image/jpeg">JPEG (.jpg)</option>
                    <option value="image/webp">WEBP (.webp)</option>
                </select>
            </div>

            <button id="copyBtn" disabled style="background-color: #007bff; margin-bottom: 5px;">Copiar al Portapapeles</button>
            <button id="downloadSingleBtn" disabled style="margin-bottom: 5px;">Descargar Imagen</button>
            <button id="downloadZipBtn" disabled>Descargar Todas (.ZIP)</button>
            <button id="clearAllBtn" class="clear-all-btn">Limpiar Todo</button>
        </div>

        <div class="preview-area">
            <div class="gallery" id="gallery"></div>
            <div class="canvas-wrap" id="canvasWrap">
                <div id="brushCursor"></div>
                <canvas id="canvas"></canvas>
            </div>
            <button id="deleteCurrentBtn" class="delete-current-btn" disabled>Borrar Imagen Seleccionada</button>
        </div>
    </div>

    <script type="module">
        let removeBackgroundFn = null;

        // Load background removal engine
        async function getRemover() {
            if (removeBackgroundFn) return removeBackgroundFn;
            try {
                const imgly = await import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.7/+esm');
                if (imgly && imgly.removeBackground) {
                    removeBackgroundFn = imgly.removeBackground;
                    return removeBackgroundFn;
                }
            } catch (e) {
                console.warn('Cargando motor de respaldo:', e);
            }

            try {
                const tf = await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.0');
                if (tf && tf.pipeline) {
                    const segmenter = await tf.pipeline('image-segmentation', 'briaai/RMBG-1.4');
                    removeBackgroundFn = async (img) => {
                        const raw = await tf.RawImage.fromCanvas(img);
                        const res = await segmenter(raw);
                        const maskRaw = Array.isArray(res) ? res[0].mask : (res.mask || res);
                        const mCanvas = maskRaw.toCanvas();
                        const c = document.createElement('canvas');
                        c.width = img.naturalWidth || img.width;
                        c.height = img.naturalHeight || img.height;
                        const ctx = c.getContext('2d');
                        ctx.drawImage(img, 0, 0, c.width, c.height);
                        ctx.globalCompositeOperation = 'destination-in';
                        ctx.drawImage(mCanvas, 0, 0, c.width, c.height);
                        return new Promise(r => c.toBlob(r, 'image/png'));
                    };
                    return removeBackgroundFn;
                }
            } catch (e) {
                console.warn('Fallback a matting de color local:', e);
            }

            // Local fallback (offline chroma key)
            removeBackgroundFn = async (img) => {
                const c = document.createElement('canvas');
                const w = img.naturalWidth || img.width;
                const h = img.naturalHeight || img.height;
                c.width = w;
                c.height = h;
                const ctx = c.getContext('2d');
                ctx.drawImage(img, 0, 0, w, h);
                const data = ctx.getImageData(0, 0, w, h);
                const d = data.data;
                const corners = [0, (w - 1) * 4, ((h - 1) * w) * 4, ((h - 1) * w + w - 1) * 4];
                let r = 0, g = 0, b = 0;
                corners.forEach(i => { r += d[i]; g += d[i+1]; b += d[i+2]; });
                r /= 4; g /= 4; b /= 4;
                for (let i = 0; i < d.length; i += 4) {
                    const dist = Math.hypot(d[i]-r, d[i+1]-g, d[i+2]-b);
                    if (dist < 36) d[i+3] = 0;
                    else if (dist < 50) d[i+3] = Math.round(((dist - 36) / 14) * 255);
                }
                ctx.putImageData(data, 0, 0);
                return new Promise(res => c.toBlob(res, 'image/png'));
            };
            return removeBackgroundFn;
        }

        const imgInput = document.getElementById('imgInput');
        const statusLabel = document.getElementById('statusLabel');
        const bgType = document.getElementById('bgType');
        const colorGroup = document.getElementById('colorGroup');
        const bgColor = document.getElementById('bgColor');
        const customBgGroup = document.getElementById('customBgGroup');
        const customBgInput = document.getElementById('customBgInput');
        const blurGroup = document.getElementById('blurGroup');
        const blurAmount = document.getElementById('blurAmount');
        const blurVal = document.getElementById('blurVal');

        const brushToggle = document.getElementById('brushToggle');
        const brushControls = document.getElementById('brushControls');
        const btnErase = document.getElementById('btnErase');
        const btnRestore = document.getElementById('btnRestore');
        const brushSize = document.getElementById('brushSize');
        const brushSizeVal = document.getElementById('brushSizeVal');
        const btnResetMask = document.getElementById('btnResetMask');
        const brushCursor = document.getElementById('brushCursor');

        const exportFormat = document.getElementById('exportFormat');
        const copyBtn = document.getElementById('copyBtn');
        const downloadSingleBtn = document.getElementById('downloadSingleBtn');
        const downloadZipBtn = document.getElementById('downloadZipBtn');
        const clearAllBtn = document.getElementById('clearAllBtn');
        const deleteCurrentBtn = document.getElementById('deleteCurrentBtn');

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const canvasWrap = document.getElementById('canvasWrap');
        const gallery = document.getElementById('gallery');

        let loadedImages = [];
        let selectedIndex = -1;
        let customBgImage = null;

        let isBrushActive = false;
        let brushMode = 'erase';
        let brushRadius = 25;
        let isPainting = false;

        // Background type changes
        bgType.addEventListener('change', () => {
            colorGroup.classList.add('hidden');
            customBgGroup.classList.add('hidden');
            blurGroup.classList.add('hidden');
            if (bgType.value === 'color') colorGroup.classList.remove('hidden');
            if (bgType.value === 'image') customBgGroup.classList.remove('hidden');
            if (bgType.value === 'blur') blurGroup.classList.remove('hidden');
            renderCurrent();
        });

        bgColor.addEventListener('input', renderCurrent);
        blurAmount.addEventListener('input', () => {
            blurVal.textContent = `${blurAmount.value}px`;
            renderCurrent();
        });

        customBgInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const r = new FileReader();
            r.onload = (evt) => {
                const img = new Image();
                img.onload = () => { customBgImage = img; renderCurrent(); };
                img.src = evt.target.result;
            };
            r.readAsDataURL(file);
        });

        // Brush setup
        brushToggle.addEventListener('change', () => {
            isBrushActive = brushToggle.checked;
            if (isBrushActive) {
                brushControls.classList.remove('hidden');
                brushCursor.style.display = 'block';
                canvas.style.cursor = 'none';
            } else {
                brushControls.classList.add('hidden');
                brushCursor.style.display = 'none';
                canvas.style.cursor = 'default';
            }
        });

        btnErase.addEventListener('click', () => {
            brushMode = 'erase';
            btnErase.style.backgroundColor = '#dc3545';
            btnRestore.style.backgroundColor = '#6c757d';
        });

        btnRestore.addEventListener('click', () => {
            brushMode = 'restore';
            btnRestore.style.backgroundColor = '#28a745';
            btnErase.style.backgroundColor = '#6c757d';
        });

        brushSize.addEventListener('input', () => {
            brushRadius = parseInt(brushSize.value, 10);
            brushSizeVal.textContent = `${brushRadius}px`;
            updateBrushCursor();
        });

        function updateBrushCursor() {
            const rect = canvas.getBoundingClientRect();
            const scale = rect.width / canvas.width;
            const size = (brushRadius * 2) * scale;
            brushCursor.style.width = `${Math.max(size, 6)}px`;
            brushCursor.style.height = `${Math.max(size, 6)}px`;
        }

        btnResetMask.addEventListener('click', () => {
            if (selectedIndex === -1 || !loadedImages[selectedIndex]) return;
            const item = loadedImages[selectedIndex];
            const mCtx = item.maskCanvas.getContext('2d');
            mCtx.clearRect(0, 0, item.maskCanvas.width, item.maskCanvas.height);
            mCtx.drawImage(item.origMaskCanvas, 0, 0);
            renderCurrent();
        });

        // Canvas events for brush
        canvas.addEventListener('mouseenter', () => {
            if (isBrushActive) brushCursor.style.display = 'block';
        });
        canvas.addEventListener('mouseleave', () => {
            brushCursor.style.display = 'none';
            isPainting = false;
        });
        window.addEventListener('mouseup', () => isPainting = false);

        canvas.addEventListener('mousemove', (e) => {
            if (!isBrushActive) return;
            const wrapRect = canvasWrap.getBoundingClientRect();
            brushCursor.style.left = `${e.clientX - wrapRect.left}px`;
            brushCursor.style.top = `${e.clientY - wrapRect.top}px`;
            updateBrushCursor();

            if (isPainting && selectedIndex !== -1) {
                applyBrush(e);
            }
        });

        canvas.addEventListener('mousedown', (e) => {
            if (!isBrushActive || selectedIndex === -1) return;
            isPainting = true;
            applyBrush(e);
        });

        function applyBrush(e) {
            const item = loadedImages[selectedIndex];
            if (!item || !item.maskCanvas) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const x = (e.clientX - rect.left) * scaleX;
            const y = (e.clientY - rect.top) * scaleY;

            const mCtx = item.maskCanvas.getContext('2d');
            mCtx.save();
            mCtx.beginPath();
            mCtx.arc(x, y, brushRadius, 0, Math.PI * 2);
            if (brushMode === 'erase') {
                mCtx.globalCompositeOperation = 'destination-out';
                mCtx.fill();
            } else {
                mCtx.globalCompositeOperation = 'source-over';
                mCtx.fillStyle = '#ffffff';
                mCtx.fill();
            }
            mCtx.restore();
            renderCurrent();
        }

        // File loading & paste
        imgInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;
            await processFiles(files);
            imgInput.value = '';
        });

        window.addEventListener('paste', async (e) => {
            const items = e.clipboardData.items;
            const files = [];
            for (let item of items) {
                if (item.type.indexOf('image') !== -1) {
                    const blob = item.getAsFile();
                    if (blob) {
                        const file = new File([blob], `pegado_${Date.now()}.png`, { type: blob.type });
                        files.push(file);
                    }
                }
            }
            if (files.length > 0) await processFiles(files);
        });

        window.addEventListener('dragover', (e) => e.preventDefault());
        window.addEventListener('drop', async (e) => {
            e.preventDefault();
            const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
            if (files.length > 0) await processFiles(files);
        });

        async function processFiles(files) {
            const remover = await getRemover();
            for (let file of files) {
                const img = await loadImage(file);
                const item = {
                    name: file.name,
                    img: img,
                    maskCanvas: null,
                    origMaskCanvas: null,
                    processing: true
                };
                loadedImages.push(item);
                selectedIndex = loadedImages.length - 1;
                renderGallery();

                statusLabel.textContent = `Procesando ${file.name}...`;
                try {
                    const blob = await remover(img);
                    const cutout = await blobToImage(blob);
                    const w = img.naturalWidth || img.width;
                    const h = img.naturalHeight || img.height;

                    const maskCanvas = document.createElement('canvas');
                    maskCanvas.width = w;
                    maskCanvas.height = h;
                    const mCtx = maskCanvas.getContext('2d');
                    mCtx.drawImage(cutout, 0, 0, w, h);

                    const origMaskCanvas = document.createElement('canvas');
                    origMaskCanvas.width = w;
                    origMaskCanvas.height = h;
                    origMaskCanvas.getContext('2d').drawImage(maskCanvas, 0, 0);

                    item.maskCanvas = maskCanvas;
                    item.origMaskCanvas = origMaskCanvas;
                    item.processing = false;
                    statusLabel.textContent = 'Procesado';
                } catch (err) {
                    console.error(err);
                    statusLabel.textContent = 'Error procesando';
                    item.processing = false;
                }
                renderGallery();
                renderCurrent();
            }
        }

        function loadImage(file) {
            return new Promise((resolve) => {
                const r = new FileReader();
                r.onload = (e) => {
                    const img = new Image();
                    img.onload = () => resolve(img);
                    img.src = e.target.result;
                };
                r.readAsDataURL(file);
            });
        }

        function blobToImage(blob) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.src = URL.createObjectURL(blob);
            });
        }

        function renderCurrent() {
            if (selectedIndex === -1 || !loadedImages[selectedIndex]) {
                canvas.width = 0;
                canvas.height = 0;
                return;
            }

            const item = loadedImages[selectedIndex];
            const img = item.img;
            const w = img.naturalWidth || img.width;
            const h = img.naturalHeight || img.height;

            canvas.width = w;
            canvas.height = h;

            if (item.processing || !item.maskCanvas) {
                ctx.drawImage(img, 0, 0, w, h);
                return;
            }

            // 1. Draw Background
            ctx.clearRect(0, 0, w, h);
            if (bgType.value === 'color') {
                ctx.fillStyle = bgColor.value;
                ctx.fillRect(0, 0, w, h);
            } else if (bgType.value === 'image' && customBgImage) {
                const scale = Math.max(w / customBgImage.width, h / customBgImage.height);
                const sw = customBgImage.width * scale;
                const sh = customBgImage.height * scale;
                ctx.drawImage(customBgImage, (w - sw) / 2, (h - sh) / 2, sw, sh);
            } else if (bgType.value === 'blur') {
                ctx.save();
                ctx.filter = `blur(${blurAmount.value}px)`;
                ctx.drawImage(img, -20, -20, w + 40, h + 40);
                ctx.restore();
            }

            // 2. Draw Cutout Subject in full original resolution
            const fg = document.createElement('canvas');
            fg.width = w;
            fg.height = h;
            const fgCtx = fg.getContext('2d');
            fgCtx.drawImage(img, 0, 0, w, h);
            fgCtx.globalCompositeOperation = 'destination-in';
            fgCtx.drawImage(item.maskCanvas, 0, 0, w, h);

            ctx.drawImage(fg, 0, 0);
        }

        function renderGallery() {
            gallery.innerHTML = '';
            loadedImages.forEach((item, index) => {
                const wrap = document.createElement('div');
                wrap.className = 'thumb-wrapper';

                const thumb = document.createElement('img');
                thumb.src = item.img.src;
                if (index === selectedIndex) thumb.classList.add('active');

                thumb.addEventListener('click', () => {
                    selectedIndex = index;
                    updateActiveThumb();
                    renderCurrent();
                });

                const delBtn = document.createElement('button');
                delBtn.className = 'delete-thumb-btn';
                delBtn.innerHTML = '&times;';
                delBtn.title = 'Borrar imagen';
                delBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    removeImage(index);
                });

                wrap.appendChild(thumb);
                wrap.appendChild(delBtn);
                gallery.appendChild(wrap);
            });

            const hasImg = loadedImages.length > 0;
            const ready = loadedImages.some(i => !i.processing && i.maskCanvas);
            copyBtn.disabled = !ready;
            downloadSingleBtn.disabled = !ready;
            downloadZipBtn.disabled = !ready;
            deleteCurrentBtn.disabled = !hasImg;
        }

        function updateActiveThumb() {
            gallery.querySelectorAll('.thumb-wrapper').forEach((wrap, idx) => {
                const img = wrap.querySelector('img');
                if (idx === selectedIndex) {
                    img.classList.add('active');
                    wrap.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                } else {
                    img.classList.remove('active');
                }
            });
        }

        function removeImage(index) {
            if (index < 0 || index >= loadedImages.length) return;
            loadedImages.splice(index, 1);
            if (loadedImages.length === 0) {
                selectedIndex = -1;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                canvas.width = 0;
                canvas.height = 0;
                statusLabel.textContent = 'Listo para procesar';
            } else if (selectedIndex >= loadedImages.length) {
                selectedIndex = loadedImages.length - 1;
            }
            renderGallery();
            renderCurrent();
        }

        deleteCurrentBtn.addEventListener('click', () => {
            if (selectedIndex !== -1) removeImage(selectedIndex);
        });

        clearAllBtn.addEventListener('click', () => {
            loadedImages = [];
            selectedIndex = -1;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            canvas.width = 0;
            canvas.height = 0;
            statusLabel.textContent = 'Listo para procesar';
            renderGallery();
        });

        // Copy button
        copyBtn.addEventListener('click', async () => {
            if (selectedIndex === -1 || !loadedImages[selectedIndex]) return;
            try {
                canvas.toBlob(async (blob) => {
                    if (!blob) return;
                    if (navigator.clipboard && window.ClipboardItem) {
                        const item = new ClipboardItem({ 'image/png': blob });
                        await navigator.clipboard.write([item]);
                        const orig = copyBtn.textContent;
                        copyBtn.textContent = '¡Copiado!';
                        setTimeout(() => copyBtn.textContent = orig, 2000);
                    } else {
                        alert('Tu navegador no soporta la copia directa de imágenes.');
                    }
                }, 'image/png');
            } catch (err) {
                console.error(err);
                alert('No se pudo copiar al portapapeles.');
            }
        });

        // Download Single Image
        downloadSingleBtn.addEventListener('click', () => {
            if (selectedIndex === -1 || !loadedImages[selectedIndex]) return;
            const item = loadedImages[selectedIndex];
            const mime = exportFormat.value;
            let ext = 'png';
            if (mime === 'image/jpeg') ext = 'jpg';
            if (mime === 'image/webp') ext = 'webp';

            const baseName = item.name.replace(/\.[^/.]+$/, "");
            const link = document.createElement('a');
            link.download = `${baseName}_sin_fondo.${ext}`;
            link.href = canvas.toDataURL(mime, 0.95);
            link.click();
        });

        // Download ZIP
        downloadZipBtn.addEventListener('click', async () => {
            const valid = loadedImages.filter(i => !i.processing && i.maskCanvas);
            if (valid.length === 0) return;

            const zip = new JSZip();
            downloadZipBtn.disabled = true;
            downloadZipBtn.textContent = 'Generando ZIP...';

            const mime = exportFormat.value;
            let ext = 'png';
            if (mime === 'image/jpeg') ext = 'jpg';
            if (mime === 'image/webp') ext = 'webp';

            valid.forEach((item, idx) => {
                const w = item.img.naturalWidth || item.img.width;
                const h = item.img.naturalHeight || item.img.height;
                const c = document.createElement('canvas');
                c.width = w;
                c.height = h;
                const tCtx = c.getContext('2d');

                if (bgType.value === 'color') {
                    tCtx.fillStyle = bgColor.value;
                    tCtx.fillRect(0, 0, w, h);
                } else if (bgType.value === 'image' && customBgImage) {
                    const scale = Math.max(w / customBgImage.width, h / customBgImage.height);
                    tCtx.drawImage(customBgImage, (w - customBgImage.width * scale) / 2, (h - customBgImage.height * scale) / 2, customBgImage.width * scale, customBgImage.height * scale);
                } else if (bgType.value === 'blur') {
                    tCtx.save();
                    tCtx.filter = `blur(${blurAmount.value}px)`;
                    tCtx.drawImage(item.img, -20, -20, w + 40, h + 40);
                    tCtx.restore();
                }

                const fg = document.createElement('canvas');
                fg.width = w;
                fg.height = h;
                const fgCtx = fg.getContext('2d');
                fgCtx.drawImage(item.img, 0, 0, w, h);
                fgCtx.globalCompositeOperation = 'destination-in';
                fgCtx.drawImage(item.maskCanvas, 0, 0, w, h);

                tCtx.drawImage(fg, 0, 0);

                const dataUrl = c.toDataURL(mime, 0.95);
                const seq = String(idx + 1).padStart(3, '0');
                const baseName = item.name.replace(/\.[^/.]+$/, "");
                zip.file(`${seq}_${baseName}.${ext}`, dataUrl.split(',')[1], { base64: true });
            });

            const content = await zip.generateAsync({ type: 'blob' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(content);
            link.download = 'imagenes_sin_fondo.zip';
            link.click();

            downloadZipBtn.disabled = false;
            downloadZipBtn.textContent = 'Descargar Todas (.ZIP)';
        });
    </script>
</body>
</html>
