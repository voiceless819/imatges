<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marca de Agua en Lote Completa</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 20px auto;
            padding: 0 20px;
            text-align: center;
        }
        .paste-notice {
            background-color: #e9ecef;
            border: 2px dashed #6c757d;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
            color: #495057;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            align-items: flex-start;
        }
        .controls {
            flex: 1;
            min-width: 290px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-align: left;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .quick-btn-group {
            display: flex;
            gap: 5px;
            margin-top: 4px;
        }
        .quick-btn-group button {
            padding: 2px 6px;
            font-size: 12px;
            background-color: #6c757d;
        }
        .hidden {
            display: none !important;
        }
        .preview-area {
            flex: 2;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        canvas {
            border: 2px dashed #ccc;
            max-width: 100%;
            height: auto;
        }
        .gallery {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 10px 0;
            min-height: 90px;
            align-items: center;
        }
        .thumb-wrapper {
            position: relative;
            display: inline-block;
            flex-shrink: 0;
        }
        .gallery img {
            height: 70px;
            border: 2px solid transparent;
            border-radius: 4px;
            cursor: pointer;
            object-fit: cover;
            display: block;
        }
        .gallery img.active {
            border-color: #007bff;
        }
        .delete-thumb-btn {
            position: absolute;
            top: -6px;
            right: -6px;
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 12px;
            line-height: 18px;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            box-shadow: 0px 2px 4px rgba(0,0,0,0.3);
        }
        .delete-thumb-btn:hover {
            background-color: #bd2130;
        }
        .delete-current-btn {
            background-color: #dc3545;
            margin-top: 5px;
        }
        .delete-current-btn:hover {
            background-color: #bd2130;
        }
        .clear-all-btn {
            background-color: #6c757d;
            margin-top: 5px;
        }
        .clear-all-btn:hover {
            background-color: #5a6268;
        }
        button {
            padding: 10px;
            font-size: 15px;
            cursor: pointer;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        .sections-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        .section-tab {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            font-size: 14px;
            background-color: #e9ecef;
            color: #495057;
            border: 1px solid #ced4da;
            border-radius: 5px;
            cursor: pointer;
        }
        .section-tab.active {
            background-color: #007bff;
            color: white;
            border-color: #007bff;
            font-weight: bold;
        }
        .section-tab-count {
            font-size: 11px;
            opacity: 0.85;
        }
        .section-tab-btn {
            background: transparent;
            color: inherit;
            border: none;
            padding: 0 3px;
            font-size: 13px;
            cursor: pointer;
            line-height: 1;
            opacity: 0.75;
        }
        .section-tab-btn:hover {
            opacity: 1;
        }
        .add-section-btn {
            padding: 6px 12px;
            font-size: 14px;
            background-color: #28a745;
        }
    </style>
</head>
<body>

    <h1>Marca de Agua en Lote</h1>
    <div class="paste-notice">
        <strong>Tip:</strong> Presiona <strong>Ctrl + V</strong> (o Cmd + V) para pegar imágenes desde el portapapeles.
    </div>

    <div class="sections-bar" id="sectionsBar"></div>

    <div class="container">
        <div class="controls">
            <div class="control-group">
                <label for="imgInput">Seleccionar Imágenes:</label>
                <input type="file" id="imgInput" accept="image/*" multiple>
            </div>

            <div class="control-group">
                <label for="textInput">Texto Base:</label>
                <input type="text" id="textInput" value="© Mi Marca">
            </div>

            <div class="control-group">
                <label for="fontFamily">Fuente de Letra:</label>
                <select id="fontFamily">
                    <option value="Arial, sans-serif">Arial</option>
                    <option value="Verdana, sans-serif">Verdana</option>
                    <option value="'Times New Roman', serif">Times New Roman</option>
                    <option value="'Courier New', monospace">Courier New</option>
                    <option value="Georgia, serif">Georgia</option>
                    <option value="Impact, sans-serif">Impact</option>
                    <option value="'Comic Sans MS', cursive">Comic Sans MS</option>
                    <option value="'Trebuchet MS', sans-serif">Trebuchet MS</option>
                </select>
            </div>

            <div class="control-group">
                <label for="position">Ubicación de la Marca:</label>
                <select id="position">
                    <option value="center">Centro</option>
                    <option value="tile">Mosaico (Repetida / Patrón)</option>
                    <optgroup label="Esquinas">
                        <option value="top-left">Arriba a la izquierda</option>
                        <option value="top-right">Arriba a la derecha</option>
                        <option value="bottom-left">Abajo a la izquierda</option>
                        <option value="bottom-right">Abajo a la derecha</option>
                    </optgroup>
                    <optgroup label="Bordes Centrales">
                        <option value="top-center">Arriba al centro</option>
                        <option value="bottom-center">Abajo al centro</option>
                        <option value="middle-left">Centro a la izquierda</option>
                        <option value="middle-right">Centro a la derecha</option>
                    </optgroup>
                </select>
            </div>

            <div class="control-group hidden" id="tileDensityGroup">
                <label for="tileSpacing">Separación de Mosaico (menor = más denso):</label>
                <input type="range" id="tileSpacing" min="10" max="300" value="80">
            </div>

            <div class="control-group">
                <label for="rotation">Rotación: <strong id="rotationVal">0°</strong></label>
                <input type="range" id="rotation" min="-180" max="180" value="0">
                <div class="quick-btn-group">
                    <button type="button" onclick="setRotation(-90)">-90°</button>
                    <button type="button" onclick="setRotation(-45)">-45°</button>
                    <button type="button" onclick="setRotation(0)">0° (Horizontal)</button>
                    <button type="button" onclick="setRotation(45)">45°</button>
                    <button type="button" onclick="setRotation(90)">90°</button>
                </div>
            </div>

            <div class="control-group">
                <label for="fontSize">Tamaño del Texto (px):</label>
                <input type="range" id="fontSize" min="10" max="200" value="48">
            </div>

            <div class="control-group">
                <label for="textColor">Color del Texto:</label>
                <input type="color" id="textColor" value="#ffffff">
            </div>

            <div class="control-group">
                <label for="opacity">Opacidad:</label>
                <input type="range" id="opacity" min="0.05" max="1" step="0.05" value="0.5">
            </div>

            
            <div class="control-group">
                <label for="exportFormat">Formato de Descarga:</label>
                <select id="exportFormat">
                    <option value="image/png">PNG (.png)</option>
                    <option value="image/jpeg">JPEG (.jpg)</option>
                    <option value="image/webp">WEBP (.webp)</option>
                </select>
            </div>

            <button id="copyBtn" disabled style="background-color: #007bff; margin-bottom: 5px;">Copiar al Portapapeles</button>
            <button id="downloadZipBtn" disabled>Descargar Todas (.ZIP)</button>
            <button id="downloadAllSectionsBtn" class="hidden" disabled style="background-color: #17a2b8;">Descargar Todas las Secciones (.ZIP)</button>

            <button id="clearAllBtn" class="clear-all-btn">Limpiar Sección</button>
        </div>

        <div class="preview-area">
            <div class="gallery" id="gallery"></div>
            <canvas id="canvas"></canvas>
            <button id="deleteCurrentBtn" class="delete-current-btn" disabled>Borrar Imagen Seleccionada</button>
        </div>
    </div>

    <script>
        const imgInput = document.getElementById('imgInput');
        const textInput = document.getElementById('textInput');
        const fontFamilySelect = document.getElementById('fontFamily');
        const fontSizeInput = document.getElementById('fontSize');
        const textColorInput = document.getElementById('textColor');
        const opacityInput = document.getElementById('opacity');
        const rotationInput = document.getElementById('rotation');
        const rotationVal = document.getElementById('rotationVal');
        const positionSelect = document.getElementById('position');
        const tileDensityGroup = document.getElementById('tileDensityGroup');
        const tileSpacingInput = document.getElementById('tileSpacing');
        const exportFormatSelect = document.getElementById('exportFormat');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const gallery = document.getElementById('gallery');
        const sectionsBar = document.getElementById('sectionsBar');
        const copyBtn = document.getElementById('copyBtn');
        const downloadZipBtn = document.getElementById('downloadZipBtn');
        const downloadAllSectionsBtn = document.getElementById('downloadAllSectionsBtn');
        const deleteCurrentBtn = document.getElementById('deleteCurrentBtn');
        const clearAllBtn = document.getElementById('clearAllBtn');

        let sections = [];
        let activeSectionId = null;
        let sectionCounter = 1;

        function getDefaultControls() {
            return {
                text: '© Mi Marca',
                fontFamily: 'Arial, sans-serif',
                fontSize: '48',
                textColor: '#ffffff',
                opacity: '0.5',
                rotation: '0',
                position: 'center',
                tileSpacing: '80',
                exportFormat: 'image/png'
            };
        }

        function getControlsFromDOM() {
            return {
                text: textInput.value,
                fontFamily: fontFamilySelect.value,
                fontSize: fontSizeInput.value,
                textColor: textColorInput.value,
                opacity: opacityInput.value,
                rotation: rotationInput.value,
                position: positionSelect.value,
                tileSpacing: tileSpacingInput.value,
                exportFormat: exportFormatSelect.value
            };
        }

        function applyControlsToDOM(controls) {
            const c = controls || getDefaultControls();
            textInput.value = c.text ?? '© Mi Marca';
            fontFamilySelect.value = c.fontFamily ?? 'Arial, sans-serif';
            fontSizeInput.value = c.fontSize ?? '48';
            textColorInput.value = c.textColor ?? '#ffffff';
            opacityInput.value = c.opacity ?? '0.5';
            rotationInput.value = c.rotation ?? '0';
            rotationVal.textContent = `${rotationInput.value}°`;
            positionSelect.value = c.position ?? 'center';
            tileSpacingInput.value = c.tileSpacing ?? '80';
            exportFormatSelect.value = c.exportFormat ?? 'image/png';
        }

        function getActiveSection() {
            return sections.find(s => s.id === activeSectionId) || sections[0];
        }

        function createSection(name, inheritControls = null) {
            const id = `sec_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`;
            return {
                id: id,
                name: name || `Sección ${sectionCounter++}`,
                controls: inheritControls ? { ...inheritControls } : getDefaultControls(),
                images: [],
                selectedIndex: -1
            };
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadState();
        });

        function saveState() {
            const activeSec = getActiveSection();
            if (activeSec) {
                activeSec.controls = getControlsFromDOM();
            }

            const serialized = sections.map(sec => ({
                id: sec.id,
                name: sec.name,
                controls: sec.controls,
                selectedIndex: sec.selectedIndex,
                images: sec.images.map(item => ({ name: item.name, src: item.img.src }))
            }));

            try {
                localStorage.setItem('watermark_sections_v1', JSON.stringify(serialized));
                localStorage.setItem('watermark_active_section', activeSectionId || '');
            } catch (e) {
                console.warn('El almacenamiento local está lleno o no está disponible.', e);
            }
        }

        async function loadState() {
            const savedSections = localStorage.getItem('watermark_sections_v1');

            if (savedSections) {
                try {
                    const parsed = JSON.parse(savedSections);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        sections = [];
                        for (const raw of parsed) {
                            const imgs = [];
                            if (Array.isArray(raw.images)) {
                                for (const item of raw.images) {
                                    const img = await loadImageFromSrc(item.src);
                                    imgs.push({ name: item.name, img: img });
                                }
                            }
                            let selIdx = raw.selectedIndex ?? -1;
                            if (selIdx >= imgs.length) selIdx = imgs.length - 1;
                            sections.push({
                                id: raw.id,
                                name: raw.name || 'Sección',
                                controls: { ...getDefaultControls(), ...(raw.controls || {}) },
                                images: imgs,
                                selectedIndex: selIdx
                            });
                        }
                        sectionCounter = sections.length + 1;
                        const savedActive = localStorage.getItem('watermark_active_section');
                        activeSectionId = sections.some(s => s.id === savedActive) ? savedActive : sections[0].id;
                    }
                } catch (e) {
                    console.warn('Error cargando secciones guardadas:', e);
                }
            }

            // Migration from single-instance localStorage format if present
            if (sections.length === 0) {
                const sec = createSection('Sección 1');
                try {
                    const savedControls = localStorage.getItem('watermark_controls');
                    const savedImages = localStorage.getItem('watermark_images');
                    if (savedControls) {
                        const data = JSON.parse(savedControls);
                        sec.controls = { ...getDefaultControls(), ...data };
                        sec.selectedIndex = data.selectedIndex ?? -1;
                    }
                    if (savedImages) {
                        const imagesData = JSON.parse(savedImages);
                        for (const item of imagesData) {
                            const img = await loadImageFromSrc(item.src);
                            sec.images.push({ name: item.name, img: img });
                        }
                        if (sec.selectedIndex >= sec.images.length) {
                            sec.selectedIndex = sec.images.length - 1;
                        }
                    }
                } catch (e) {
                    console.warn('Error migrando datos previos:', e);
                }
                sections = [sec];
                activeSectionId = sec.id;
            }

            const activeSec = getActiveSection();
            applyControlsToDOM(activeSec.controls);
            renderSectionsBar();
            renderGallery();
            renderCurrentPreview();
        }

        function loadImageFromSrc(src) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.src = src;
            });
        }

        function renderSectionsBar() {
            sectionsBar.innerHTML = '';

            sections.forEach(sec => {
                const tab = document.createElement('div');
                tab.className = 'section-tab' + (sec.id === activeSectionId ? ' active' : '');

                const titleSpan = document.createElement('span');
                titleSpan.textContent = sec.name;
                titleSpan.ondblclick = (e) => {
                    e.stopPropagation();
                    renameSection(sec.id);
                };

                const countSpan = document.createElement('span');
                countSpan.className = 'section-tab-count';
                countSpan.textContent = `(${sec.images.length})`;

                const renameBtn = document.createElement('button');
                renameBtn.type = 'button';
                renameBtn.className = 'section-tab-btn';
                renameBtn.title = 'Renombrar sección';
                renameBtn.textContent = 'Editar';
                renameBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    renameSection(sec.id);
                });

                tab.appendChild(titleSpan);
                tab.appendChild(countSpan);
                tab.appendChild(renameBtn);

                if (sections.length > 1) {
                    const delBtn = document.createElement('button');
                    delBtn.type = 'button';
                    delBtn.className = 'section-tab-btn';
                    delBtn.title = 'Eliminar sección';
                    delBtn.innerHTML = '&times;';
                    delBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        deleteSection(sec.id);
                    });
                    tab.appendChild(delBtn);
                }

                tab.addEventListener('click', () => switchSection(sec.id));
                sectionsBar.appendChild(tab);
            });

            const addBtn = document.createElement('button');
            addBtn.type = 'button';
            addBtn.className = 'add-section-btn';
            addBtn.textContent = '+ Nueva Sección';
            addBtn.addEventListener('click', addSection);
            sectionsBar.appendChild(addBtn);

            if (sections.length > 1) {
                downloadAllSectionsBtn.classList.remove('hidden');
            } else {
                downloadAllSectionsBtn.classList.add('hidden');
            }
            const anySectionHasImages = sections.some(s => s.images.length > 0);
            downloadAllSectionsBtn.disabled = !anySectionHasImages;
        }

        function switchSection(id) {
            if (id === activeSectionId) return;
            const current = getActiveSection();
            if (current) current.controls = getControlsFromDOM();

            activeSectionId = id;
            const next = getActiveSection();
            applyControlsToDOM(next.controls);
            renderSectionsBar();
            renderGallery();
            renderCurrentPreview();
            saveState();
        }

        function addSection() {
            const current = getActiveSection();
            if (current) current.controls = getControlsFromDOM();

            const nextName = `Sección ${sections.length + 1}`;
            const newSec = createSection(nextName, current ? current.controls : null);
            sections.push(newSec);
            activeSectionId = newSec.id;

            applyControlsToDOM(newSec.controls);
            renderSectionsBar();
            renderGallery();
            renderCurrentPreview();
            saveState();
        }

        function renameSection(id) {
            const sec = sections.find(s => s.id === id);
            if (!sec) return;
            const newName = prompt('Nombre de la sección:', sec.name);
            if (newName !== null && newName.trim() !== '') {
                sec.name = newName.trim();
                renderSectionsBar();
                saveState();
            }
        }

        function deleteSection(id) {
            if (sections.length <= 1) return;
            const idx = sections.findIndex(s => s.id === id);
            if (idx === -1) return;
            sections.splice(idx, 1);

            if (activeSectionId === id) {
                const nextIdx = Math.min(idx, sections.length - 1);
                activeSectionId = sections[nextIdx].id;
                applyControlsToDOM(sections[nextIdx].controls);
            }
            renderSectionsBar();
            renderGallery();
            renderCurrentPreview();
            saveState();
        }

        window.setRotation = function(angle) {
            rotationInput.value = angle;
            rotationVal.textContent = `${angle}°`;
            renderCurrentPreview();
            saveState();
        };

        rotationInput.addEventListener('input', () => {
            rotationVal.textContent = `${rotationInput.value}°`;
            renderCurrentPreview();
            saveState();
        });

        imgInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;
            await processFiles(files);
            imgInput.value = '';
        });

        window.addEventListener('dragover', (e) => e.preventDefault());
        window.addEventListener('drop', async (e) => {
            e.preventDefault();
            const files = Array.from(e.dataTransfer.files).filter(f => f && f.type && f.type.startsWith('image/'));
            if (files.length > 0) await processFiles(files);
        });

        window.addEventListener('paste', async (e) => {
            const items = e.clipboardData?.items;
            if (!items) return;
            const files = [];

            for (let item of items) {
                if (item.type.indexOf('image') !== -1) {
                    const blob = item.getAsFile();
                    if (blob) {
                        const fileName = `pegado_${Date.now()}_${files.length + 1}.png`;
                        const file = new File([blob], fileName, { type: blob.type });
                        files.push(file);
                    }
                }
            }

            if (files.length > 0) {
                await processFiles(files);
            }
        });

        async function processFiles(files) {
            const sec = getActiveSection();
            for (let file of files) {
                const img = await loadImage(file);
                sec.images.push({ name: file.name, img: img });
            }

            sec.selectedIndex = sec.images.length - 1;
            renderSectionsBar();
            renderGallery();
            renderCurrentPreview();
            saveState();
        }

        function removeImage(index) {
            const sec = getActiveSection();
            if (index < 0 || index >= sec.images.length) return;
            sec.images.splice(index, 1);

            if (sec.images.length === 0) {
                sec.selectedIndex = -1;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                canvas.width = 0;
                canvas.height = 0;
            } else if (sec.selectedIndex >= sec.images.length) {
                sec.selectedIndex = sec.images.length - 1;
            }

            renderSectionsBar();
            renderGallery();
            renderCurrentPreview();
            saveState();
        }

        deleteCurrentBtn.addEventListener('click', () => {
            const sec = getActiveSection();
            if (sec && sec.selectedIndex !== -1) {
                removeImage(sec.selectedIndex);
            }
        });

        clearAllBtn.addEventListener('click', () => {
            const sec = getActiveSection();
            if (!sec) return;
            sec.images = [];
            sec.selectedIndex = -1;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            canvas.width = 0;
            canvas.height = 0;
            renderSectionsBar();
            renderGallery();
            renderCurrentPreview();
            saveState();
        });

        function renderGallery() {
            gallery.innerHTML = '';
            const sec = getActiveSection();
            if (!sec) return;
            
            sec.images.forEach((item, index) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'thumb-wrapper';

                const thumb = document.createElement('img');
                thumb.src = item.img.src;
                if (index === sec.selectedIndex) {
                    thumb.classList.add('active');
                }

                thumb.addEventListener('click', () => {
                    sec.selectedIndex = index;
                    updateActiveThumbnail();
                    renderCurrentPreview();
                    saveState();
                });

                const delBtn = document.createElement('button');
                delBtn.className = 'delete-thumb-btn';
                delBtn.innerHTML = '&times;';
                delBtn.title = 'Borrar imagen';
                delBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    removeImage(index);
                });

                wrapper.appendChild(thumb);
                wrapper.appendChild(delBtn);
                gallery.appendChild(wrapper);
            });

            const hasImages = sec.images.length > 0;
            downloadZipBtn.disabled = !hasImages;
            copyBtn.disabled = !hasImages;
            deleteCurrentBtn.disabled = !hasImages;
        }

        function updateActiveThumbnail() {
            const sec = getActiveSection();
            const wrappers = gallery.querySelectorAll('.thumb-wrapper');
            wrappers.forEach((wrapper, idx) => {
                const img = wrapper.querySelector('img');
                if (sec && idx === sec.selectedIndex) {
                    img.classList.add('active');
                    wrapper.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                } else {
                    img.classList.remove('active');
                }
            });
        }

        function loadImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => resolve(img);
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        function toggleTileControls() {
            if (positionSelect.value === 'tile') {
                tileDensityGroup.classList.remove('hidden');
            } else {
                tileDensityGroup.classList.add('hidden');
            }
        }

        function applyWatermarkToCanvas(imgItem, controlsOverride = null) {
            const img = imgItem.img;
            const width = img.width;
            const height = img.height;

            canvas.width = width;
            canvas.height = height;

            ctx.clearRect(0, 0, width, height);
            ctx.drawImage(img, 0, 0, width, height);

            const c = controlsOverride || getControlsFromDOM();
            const text = c.text;
            if (!text) return;

            const fontSize = parseInt(c.fontSize, 10);
            const fontFamily = c.fontFamily;
            const opacity = parseFloat(c.opacity);
            const rotation = (parseInt(c.rotation, 10) * Math.PI) / 180;
            const position = c.position;

            ctx.save();
            ctx.font = `bold ${fontSize}px ${fontFamily}`;
            ctx.fillStyle = c.textColor;
            ctx.globalAlpha = opacity;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            if (position === 'tile') {
                const spacing = parseInt(c.tileSpacing, 10);
                const textWidth = ctx.measureText(text).width;
                const stepX = textWidth + spacing;
                const stepY = fontSize + spacing;

                let rowIdx = 0;
                for (let y = -height; y < height * 2; y += stepY) {
                    const shiftX = (rowIdx % 2 === 0) ? 0 : stepX / 2;
                    for (let x = -width; x < width * 2; x += stepX) {
                        ctx.save();
                        ctx.translate(x + shiftX, y);
                        ctx.rotate(rotation);
                        ctx.fillText(text, 0, 0);
                        ctx.restore();
                    }
                    rowIdx++;
                }
            } else {
                let posX = width / 2;
                let posY = height / 2;
                const margin = fontSize;

                if (position === 'top-left') {
                    posX = margin + ctx.measureText(text).width / 2;
                    posY = margin;
                } else if (position === 'top-right') {
                    posX = width - margin - ctx.measureText(text).width / 2;
                    posY = margin;
                } else if (position === 'bottom-left') {
                    posX = margin + ctx.measureText(text).width / 2;
                    posY = height - margin;
                } else if (position === 'bottom-right') {
                    posX = width - margin - ctx.measureText(text).width / 2;
                    posY = height - margin;
                } else if (position === 'top-center') {
                    posX = width / 2;
                    posY = margin;
                } else if (position === 'bottom-center') {
                    posX = width / 2;
                    posY = height - margin;
                } else if (position === 'middle-left') {
                    posX = margin + ctx.measureText(text).width / 2;
                    posY = height / 2;
                } else if (position === 'middle-right') {
                    posX = width - margin - ctx.measureText(text).width / 2;
                    posY = height / 2;
                }

                ctx.translate(posX, posY);
                ctx.rotate(rotation);
                ctx.fillText(text, 0, 0);
            }

            ctx.restore();
        }

        function renderCurrentPreview() {
            toggleTileControls();
            const sec = getActiveSection();
            if (sec && sec.images.length > 0 && sec.selectedIndex !== -1 && sec.images[sec.selectedIndex]) {
                applyWatermarkToCanvas(sec.images[sec.selectedIndex]);
            } else {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                canvas.width = 0;
                canvas.height = 0;
            }
        }

        [textInput, fontFamilySelect, fontSizeInput, textColorInput, opacityInput, positionSelect, tileSpacingInput, exportFormatSelect].forEach(element => {
            element.addEventListener('input', () => {
                renderCurrentPreview();
                saveState();
            });
        });

        // Copy button handler
        copyBtn.addEventListener('click', async () => {
            const sec = getActiveSection();
            if (!sec || sec.selectedIndex === -1 || !sec.images[sec.selectedIndex]) return;
            try {
                canvas.toBlob(async (blob) => {
                    if (!blob) return;
                    if (navigator.clipboard && window.ClipboardItem) {
                        let copyBlob = blob;
                        if (exportFormatSelect.value !== 'image/png') {
                            const tempCanvas = document.createElement('canvas');
                            tempCanvas.width = canvas.width;
                            tempCanvas.height = canvas.height;
                            const tCtx = tempCanvas.getContext('2d');
                            tCtx.drawImage(canvas, 0, 0);
                            copyBlob = await new Promise(r => tempCanvas.toBlob(r, 'image/png'));
                        }
                        const item = new ClipboardItem({ 'image/png': copyBlob });
                        await navigator.clipboard.write([item]);
                        const origText = copyBtn.textContent;
                        copyBtn.textContent = '¡Copiado al portapapeles!';
                        setTimeout(() => { copyBtn.textContent = origText; }, 2000);
                    } else {
                        alert('Tu navegador no soporta la copia directa de imágenes al portapapeles.');
                    }
                }, exportFormatSelect.value, 0.92);
            } catch (err) {
                console.error(err);
                alert('No se pudo copiar la imagen al portapapeles.');
            }
        });

        downloadZipBtn.addEventListener('click', async () => {
            const sec = getActiveSection();
            if (!sec || sec.images.length === 0) return;

            const zip = new JSZip();
            downloadZipBtn.disabled = true;
            downloadZipBtn.textContent = 'Generando ZIP...';

            const mimeType = exportFormatSelect.value;
            let ext = 'png';
            if (mimeType === 'image/jpeg') ext = 'jpg';
            if (mimeType === 'image/webp') ext = 'webp';

            sec.images.forEach((item, index) => {
                applyWatermarkToCanvas(item);
                const dataUrl = canvas.toDataURL(mimeType, 0.92);
                const base64Data = dataUrl.split(',')[1];
                const sequenceNum = String(index + 1).padStart(3, '0');
                zip.file(`${sequenceNum}.${ext}`, base64Data, { base64: true });
            });

            const content = await zip.generateAsync({ type: 'blob' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(content);
            link.href = url;
            const safeName = sec.name.replace(/[^a-z0-9_\-]/gi, '_').toLowerCase();
            link.download = sections.length > 1 ? `imagenes_${safeName}.zip` : 'imagenes_con_marca_de_agua.zip';
            link.click();
            setTimeout(() => URL.revokeObjectURL(url), 1000);

            downloadZipBtn.disabled = false;
            downloadZipBtn.textContent = 'Descargar Todas (.ZIP)';
            renderCurrentPreview();
        });

        downloadAllSectionsBtn.addEventListener('click', async () => {
            const nonEmpty = sections.filter(s => s.images.length > 0);
            if (nonEmpty.length === 0) return;

            const zip = new JSZip();
            downloadAllSectionsBtn.disabled = true;
            downloadAllSectionsBtn.textContent = 'Generando ZIP...';

            nonEmpty.forEach((sec) => {
                const folderName = sec.name.replace(/[\\/:*?"<>|]/g, '_').trim() || 'Seccion';
                const folder = zip.folder(folderName);
                const mimeType = sec.controls.exportFormat || 'image/png';
                let ext = 'png';
                if (mimeType === 'image/jpeg') ext = 'jpg';
                if (mimeType === 'image/webp') ext = 'webp';

                sec.images.forEach((item, index) => {
                    applyWatermarkToCanvas(item, sec.controls);
                    const dataUrl = canvas.toDataURL(mimeType, 0.92);
                    const base64Data = dataUrl.split(',')[1];
                    const sequenceNum = String(index + 1).padStart(3, '0');
                    folder.file(`${sequenceNum}.${ext}`, base64Data, { base64: true });
                });
            });

            const content = await zip.generateAsync({ type: 'blob' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(content);
            link.href = url;
            link.download = 'todas_las_secciones.zip';
            link.click();
            setTimeout(() => URL.revokeObjectURL(url), 1000);

            downloadAllSectionsBtn.disabled = false;
            downloadAllSectionsBtn.textContent = 'Descargar Todas las Secciones (.ZIP)';
            renderCurrentPreview();
        });
    </script>
</body>
