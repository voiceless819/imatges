<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quitar Fondo en Lote</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 20px auto;
            padding: 0 20px;
            text-align: center;
        }
        .header-title {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 15px;
        }
        .header-title img {
            height: 38px;
            border-radius: 6px;
        }
        .header-title h1 {
            margin: 0;
        }
        .paste-notice {
            background-color: #e9ecef;
            border: 2px dashed #6c757d;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
            color: #495057;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            align-items: flex-start;
        }
        .controls {
            flex: 1;
            min-width: 290px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-align: left;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .quick-btn-group {
            display: flex;
            gap: 5px;
            margin-top: 4px;
        }
        .quick-btn-group button {
            padding: 2px 6px;
            font-size: 12px;
            background-color: #6c757d;
        }
        .hidden {
            display: none !important;
        }
        .preview-area {
            flex: 2;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .canvas-wrap {
            position: relative;
            background-image: 
                linear-gradient(45deg, #e9ecef 25%, transparent 25%), 
                linear-gradient(-45deg, #e9ecef 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #e9ecef 75%), 
                linear-gradient(-45deg, transparent 75%, #e9ecef 75%);
            background-size: 16px 16px;
            background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
            border: 2px dashed #ccc;
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas {
            max-width: 100%;
            height: auto;
            display: block;
        }
        #brushCursor {
            position: absolute;
            border: 2px solid #007bff;
            background: rgba(0, 123, 255, 0.15);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            display: none;
            z-index: 10;
        }
        .gallery {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 10px 0;
            min-height: 90px;
            align-items: center;
        }
        .thumb-wrapper {
            position: relative;
            display: inline-block;
            flex-shrink: 0;
        }
        .gallery img {
            height: 70px;
            border: 2px solid transparent;
            border-radius: 4px;
            cursor: pointer;
            object-fit: cover;
            display: block;
            background: #fff;
        }
        .gallery img.active {
            border-color: #007bff;
        }
        .delete-thumb-btn {
            position: absolute;
            top: -6px;
            right: -6px;
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 12px;
            line-height: 18px;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            box-shadow: 0px 2px 4px rgba(0,0,0,0.3);
        }
        .delete-thumb-btn:hover {
            background-color: #bd2130;
        }
        .delete-current-btn {
            background-color: #dc3545;
            margin-top: 5px;
        }
        .delete-current-btn:hover {
            background-color: #bd2130;
        }
        .clear-all-btn {
            background-color: #6c757d;
            margin-top: 5px;
        }
        .clear-all-btn:hover {
            background-color: #5a6268;
        }
        button {
            padding: 10px;
            font-size: 15px;
            cursor: pointer;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        .status-text {
            font-size: 13px;
            color: #495057;
            padding: 6px;
            background: #e9ecef;
            border-radius: 4px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="header-title">
        <img src="logo.png" alt="Logo">
        <h1>Quitar Fondo en Lote</h1>
    </div>

    <div class="paste-notice">
        📌 <strong>Tip:</strong> Presiona <strong>Ctrl + V</strong> (o Cmd + V) para pegar imágenes desde el portapapeles.
    </div>

    <div class="container">
        <div class="controls">
            <div class="control-group">
                <label for="imgInput">Seleccionar Imágenes:</label>
                <input type="file" id="imgInput" accept="image/*" multiple>
            </div>

            <div class="status-text" id="statusLabel">Listo para procesar</div>

            <div class="control-group">
                <label for="bgType">Tipo de Fondo:</label>
                <select id="bgType">
                    <option value="transparent">Transparente</option>
                    <option value="color">Color Sólido</option>
                    <option value="image">Imagen Personalizada</option>
                    <option value="blur">Desenfocar Fondo Original</option>
                </select>
            </div>

            <div class="control-group hidden" id="colorGroup">
                <label for="bgColor">Color de Fondo:</label>
                <input type="color" id="bgColor" value="#ffffff" style="height: 38px; width: 100%;">
            </div>

            <div class="control-group hidden" id="customBgGroup">
                <label for="customBgInput">Subir Imagen de Fondo:</label>
                <input type="file" id="customBgInput" accept="image/*">
            </div>

            <div class="control-group hidden" id="blurGroup">
                <label for="blurAmount">Nivel de Desenfocado: <strong id="blurVal">12px</strong></label>
                <input type="range" id="blurAmount" min="2" max="30" value="12">
            </div>

            <div class="control-group">
                <label style="cursor: pointer;">
                    <input type="checkbox" id="brushToggle"> <strong>Pincel de Retoque</strong>
                </label>
            </div>

            <div class="control-group hidden" id="brushControls">
                <div class="quick-btn-group">
                    <button type="button" id="btnErase" style="background-color: #dc3545; flex: 1;">Borrar</button>
                    <button type="button" id="btnRestore" style="background-color: #6c757d; flex: 1;">Restaurar</button>
                </div>
                <label for="brushSize" style="margin-top: 6px;">Tamaño del Pincel: <strong id="brushSizeVal">25px</strong></label>
                <input type="range" id="brushSize" min="5" max="80" value="25">
                <button type="button" id="btnResetMask" style="background-color: #6c757d; font-size: 12px; padding: 4px; margin-top: 4px;">Reiniciar Máscara</button>
            </div>

            <div class="control-group">
                <label for="exportFormat">Formato de Descarga:</label>
                <select id="exportFormat">
                    <option value="image/png">PNG (.png)</option>
                    <option value="image/jpeg">JPEG (.jpg)</option>
                    <option value="image/webp">WEBP (.webp)</option>
                </select>
            </div>

            <button id="copyBtn" disabled style="background-color: #007bff; margin-bottom: 5px;">Copiar al Portapapeles</button>
            <button id="downloadSingleBtn" disabled style="margin-bottom: 5px;">Descargar Imagen</button>
            <button id="downloadZipBtn" disabled>Descargar Todas (.ZIP)</button>
            <button id="clearAllBtn" class="clear-all-btn">Limpiar Todo</button>
        </div>

        <div class="preview-area">
            <div class="gallery" id="gallery"></div>
            <div class="canvas-wrap" id="canvasWrap">
                <div id="brushCursor"></div>
                <canvas id="canvas"></canvas>
            </div>
            <button id="deleteCurrentBtn" class="delete-current-btn" disabled>Borrar Imagen Seleccionada</button>
        </div>
    </div>

    <script type="module">
        import { removeBackground } from 'https://esm.sh/@imgly/background-removal@1.4.5';

        // DOM Mapping
        const imgInput = document.getElementById('imgInput');
        const statusLabel = document.getElementById('statusLabel');
        const bgType = document.getElementById('bgType');
        const colorGroup = document.getElementById('colorGroup');
        const bgColor = document.getElementById('bgColor');
        const customBgGroup = document.getElementById('customBgGroup');
        const customBgInput = document.getElementById('customBgInput');
        const blurGroup = document.getElementById('blurGroup');
        const blurAmount = document.getElementById('blurAmount');
        const blurVal = document.getElementById('blurVal');

        const brushToggle = document.getElementById('brushToggle');
        const brushControls = document.getElementById('brushControls');
        const btnErase = document.getElementById('btnErase');
        const btnRestore = document.getElementById('btnRestore');
        const brushSize = document.getElementById('brushSize');
        const brushSizeVal = document.getElementById('brushSizeVal');
        const btnResetMask = document.getElementById('btnResetMask');
        const brushCursor = document.getElementById('brushCursor');

        const exportFormat = document.getElementById('exportFormat');
        const copyBtn = document.getElementById('copyBtn');
        const downloadSingleBtn = document.getElementById('downloadSingleBtn');
        const downloadZipBtn = document.getElementById('downloadZipBtn');
        const clearAllBtn = document.getElementById('clearAllBtn');
        const deleteCurrentBtn = document.getElementById('deleteCurrentBtn');

        const canvasWrap = document.getElementById('canvasWrap');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const gallery = document.getElementById('gallery');

        // Style canvas containment
        canvas.style.maxWidth = '100%';
        canvas.style.maxHeight = '100%';
        canvas.style.objectFit = 'contain';

        // Global Batch Queue State
        let imageQueue = []; // Array de objetos: { id, name, originalFile, originalImg, maskCanvas, origMaskCanvas, status }
        let currentIndex = -1;
        let isProcessing = false;

        // Custom background / brush state
        let customBgImage = null;
        let isBrushActive = false;
        let brushMode = 'erase'; // 'erase' | 'restore'
        let brushRadius = 25;
        let isPainting = false;

        // Fallback local removal in case of network/offline issues
        function fallbackLocalRemoval(img) {
            return new Promise((resolve) => {
                const c = document.createElement('canvas');
                const w = img.naturalWidth || img.width;
                const h = img.naturalHeight || img.height;
                c.width = w;
                c.height = h;
                const tCtx = c.getContext('2d');
                tCtx.drawImage(img, 0, 0, w, h);
                const data = tCtx.getImageData(0, 0, w, h);
                const d = data.data;
                const corners = [0, (w - 1) * 4, ((h - 1) * w) * 4, ((h - 1) * w + w - 1) * 4];
                let r = 0, g = 0, b = 0;
                corners.forEach(i => { r += d[i]; g += d[i+1]; b += d[i+2]; });
                r /= 4; g /= 4; b /= 4;
                for (let i = 0; i < d.length; i += 4) {
                    const dist = Math.hypot(d[i]-r, d[i+1]-g, d[i+2]-b);
                    if (dist < 36) d[i+3] = 0;
                    else if (dist < 50) d[i+3] = Math.round(((dist - 36) / 14) * 255);
                }
                tCtx.putImageData(data, 0, 0);
                c.toBlob(resolve, 'image/png');
            });
        }

        // Helper to load file as HTMLImageElement
        function fileToImage(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => resolve(img);
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                r.readAsDataURL(file);
            });
        }

        // Add files to queue
        async function addFilesToQueue(files) {
            if (!files || files.length === 0) return;
            const newItems = [];

            for (const file of files) {
                if (!file.type.startsWith('image/')) continue;
                try {
                    const img = await new Promise((res, rej) => {
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            const i = new Image();
                            i.onload = () => res(i);
                            i.onerror = rej;
                            i.src = e.target.result;
                        };
                        reader.onerror = rej;
                        reader.readAsDataURL(file);
                    });

                    const item = {
                        id: Date.now() + Math.random(),
                        name: file.name,
                        originalFile: file,
                        originalImg: img,
                        maskCanvas: null,
                        origMaskCanvas: null,
                        status: 'pending'
                    };
                    imageQueue.push(item);
                    newItems.push(item);
                } catch (err) {
                    console.error('Error cargando imagen inicial:', err);
                }
            }

            if (currentIndex === -1 && imageQueue.length > 0) {
                currentIndex = 0;
            }

            renderGallery();
            renderCurrentImage();
            processQueue();
        }

        // Process Queue sequentially
        async function processQueue() {
            if (isProcessing) return;
            isProcessing = true;

            const pending = imageQueue.filter(item => item.status === 'pending');
            const total = imageQueue.length;

            for (let i = 0; i < imageQueue.length; i++) {
                const item = imageQueue[i];
                if (item.status === 'done') continue;

                statusLabel.textContent = `Procesando imagen ${i + 1} de ${total}... (Descargando IA si es la 1ª vez)`;
                renderGallery();

                try {
                    let blobSinFondo;
                    try {
                        blobSinFondo = await removeBackground(item.originalFile, {
                            model: 'medium',
                            output: { format: 'image/png', quality: 1 }
                        });
                    } catch (aiErr) {
                        console.warn('Fallback a procesamiento local:', aiErr);
                        blobSinFondo = await fallbackLocalRemoval(item.originalImg);
                    }

                    const cutoutImg = await new Promise((res, rej) => {
                        const img = new Image();
                        img.onload = () => res(img);
                        img.onerror = rej;
                        img.src = URL.createObjectURL(blobSinFondo);
                    });

                    const w = item.originalImg.naturalWidth;
                    const h = item.originalImg.naturalHeight;

                    // Mask Canvas at 100% native resolution
                    const maskCanvas = document.createElement('canvas');
                    maskCanvas.width = w;
                    maskCanvas.height = h;
                    const mCtx = maskCanvas.getContext('2d');
                    mCtx.drawImage(cutoutImg, 0, 0, w, h);

                    // Backup for mask reset
                    const origMaskCanvas = document.createElement('canvas');
                    origMaskCanvas.width = w;
                    origMaskCanvas.height = h;
                    origMaskCanvas.getContext('2d').drawImage(maskCanvas, 0, 0);

                    item.maskCanvas = maskCanvas;
                    item.origMaskCanvas = origMaskCanvas;
                    item.status = 'done';
                } catch (err) {
                    console.error('Error procesando imagen:', err);
                    item.status = 'error';
                }

                renderGallery();
                if (currentIndex === i) {
                    renderCurrentImage();
                }
            }

            isProcessing = false;
            statusLabel.textContent = `¡Completado! (${imageQueue.length} imágenes procesadas)`;
            updateButtonStates();
        }

        // Render Current Image
        function renderCurrentImage() {
            if (currentIndex === -1 || !imageQueue[currentIndex]) {
                canvas.width = 0;
                canvas.height = 0;
                updateButtonStates();
                return;
            }

            const item = imageQueue[currentIndex];
            const w = item.originalImg.naturalWidth;
            const h = item.originalImg.naturalHeight;

            canvas.width = w;
            canvas.height = h;

            ctx.clearRect(0, 0, w, h);

            if (item.status !== 'done' || !item.maskCanvas) {
                // Show original image while processing
                ctx.drawImage(item.originalImg, 0, 0, w, h);
                updateButtonStates();
                return;
            }

            // 1. Render Background
            if (bgType.value === 'transparent') {
                // Keep transparent; CSS checkerboard shows through
            } else if (bgType.value === 'color') {
                ctx.fillStyle = bgColor.value;
                ctx.fillRect(0, 0, w, h);
            } else if (bgType.value === 'image' && customBgImage) {
                const scale = Math.max(w / customBgImage.width, h / customBgImage.height);
                const sw = customBgImage.width * scale;
                const sh = customBgImage.height * scale;
                ctx.drawImage(customBgImage, (w - sw) / 2, (h - sh) / 2, sw, sh);
            } else if (bgType.value === 'blur') {
                ctx.save();
                ctx.filter = `blur(${blurAmount.value}px)`;
                ctx.drawImage(item.originalImg, -20, -20, w + 40, h + 40);
                ctx.restore();
            }

            // 2. Render Cutout Subject
            ctx.drawImage(item.maskCanvas, 0, 0, w, h);
            updateButtonStates();
        }

        // Update gallery thumbnails
        function renderGallery() {
            gallery.innerHTML = '';
            imageQueue.forEach((item, index) => {
                const wrap = document.createElement('div');
                wrap.className = 'thumb-wrapper';

                const thumb = document.createElement('img');
                thumb.src = item.originalImg.src;
                if (index === currentIndex) thumb.classList.add('active');

                thumb.addEventListener('click', () => {
                    currentIndex = index;
                    updateActiveThumbnail();
                    renderCurrentImage();
                });

                const delBtn = document.createElement('button');
                delBtn.className = 'delete-thumb-btn';
                delBtn.innerHTML = '&times;';
                delBtn.title = 'Borrar imagen';
                delBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    removeImageAt(index);
                });

                wrap.appendChild(thumb);
                wrap.appendChild(delBtn);
                gallery.appendChild(wrap);
            });
        }

        function updateActiveThumbnail() {
            const thumbs = gallery.querySelectorAll('.thumb-wrapper img');
            thumbs.forEach((img, idx) => {
                if (idx === currentIndex) {
                    img.classList.add('active');
                    img.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                } else {
                    img.classList.remove('active');
                }
            });
        }

        function updateButtonStates() {
            const hasImages = imageQueue.length > 0;
            const hasReady = imageQueue.some(i => i.status === 'done');
            copyBtn.disabled = !hasReady;
            downloadSingleBtn.disabled = !hasReady;
            downloadZipBtn.disabled = !hasReady;
            deleteCurrentBtn.disabled = !hasImages;
        }

        function removeImageAt(index) {
            if (index < 0 || index >= imageQueue.length) return;
            imageQueue.splice(index, 1);
            if (imageQueue.length === 0) {
                currentIndex = -1;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                canvas.width = 0;
                canvas.height = 0;
                statusLabel.textContent = 'Listo para procesar';
            } else if (currentIndex >= imageQueue.length) {
                currentIndex = imageQueue.length - 1;
            }
            renderGallery();
            renderCurrentImage();
        }

        // Retouch Brush Setup
        brushToggle.addEventListener('change', () => {
            isBrushActive = brushToggle.checked;
            if (isBrushActive) {
                brushControls.classList.remove('hidden');
                brushCursor.style.display = 'block';
                canvas.style.cursor = 'none';
            } else {
                brushControls.classList.add('hidden');
                brushCursor.style.display = 'none';
                canvas.style.cursor = 'default';
            }
        });

        btnErase.addEventListener('click', () => {
            brushMode = 'erase';
            btnErase.style.backgroundColor = '#dc3545';
            btnRestore.style.backgroundColor = '#6c757d';
            brushCursor.style.borderColor = '#dc3545';
        });

        btnRestore.addEventListener('click', () => {
            brushMode = 'restore';
            btnRestore.style.backgroundColor = '#28a745';
            btnErase.style.backgroundColor = '#6c757d';
            brushCursor.style.borderColor = '#28a745';
        });

        brushSize.addEventListener('input', () => {
            brushRadius = parseInt(brushSize.value, 10);
            brushSizeVal.textContent = `${brushRadius}px`;
            updateBrushCursor();
        });

        function updateBrushCursor() {
            const rect = canvas.getBoundingClientRect();
            const scale = rect.width / (canvas.width || 1);
            const size = (brushRadius * 2) * scale;
            brushCursor.style.width = `${Math.max(size, 6)}px`;
            brushCursor.style.height = `${Math.max(size, 6)}px`;
        }

        btnResetMask.addEventListener('click', () => {
            if (currentIndex === -1 || !imageQueue[currentIndex]) return;
            const item = imageQueue[currentIndex];
            if (!item.origMaskCanvas || !item.maskCanvas) return;
            const mCtx = item.maskCanvas.getContext('2d');
            mCtx.clearRect(0, 0, item.maskCanvas.width, item.maskCanvas.height);
            mCtx.drawImage(item.origMaskCanvas, 0, 0);
            renderCurrentImage();
        });

        // Brush Event Handlers (Mouse & Touch)
        canvas.addEventListener('mouseenter', () => {
            if (isBrushActive) brushCursor.style.display = 'block';
        });
        canvas.addEventListener('mouseleave', () => {
            brushCursor.style.display = 'none';
            isPainting = false;
        });
        window.addEventListener('mouseup', () => isPainting = false);

        canvas.addEventListener('mousemove', (e) => {
            if (!isBrushActive) return;
            const wrapRect = canvasWrap.getBoundingClientRect();
            brushCursor.style.left = `${e.clientX - wrapRect.left}px`;
            brushCursor.style.top = `${e.clientY - wrapRect.top}px`;
            updateBrushCursor();

            if (isPainting && currentIndex !== -1) {
                applyBrushStroke(e.clientX, e.clientY, e.shiftKey || e.button === 2);
            }
        });

        canvas.addEventListener('mousedown', (e) => {
            if (!isBrushActive || currentIndex === -1) return;
            isPainting = true;
            applyBrushStroke(e.clientX, e.clientY, e.shiftKey || e.button === 2);
        });

        // Touch events
        canvas.addEventListener('touchstart', (e) => {
            if (!isBrushActive || currentIndex === -1 || e.touches.length === 0) return;
            isPainting = true;
            const touch = e.touches[0];
            const wrapRect = canvasWrap.getBoundingClientRect();
            brushCursor.style.display = 'block';
            brushCursor.style.left = `${touch.clientX - wrapRect.left}px`;
            brushCursor.style.top = `${touch.clientY - wrapRect.top}px`;
            updateBrushCursor();
            applyBrushStroke(touch.clientX, touch.clientY, false);
            e.preventDefault();
        });

        canvas.addEventListener('touchmove', (e) => {
            if (!isBrushActive || !isPainting || e.touches.length === 0) return;
            const touch = e.touches[0];
            const wrapRect = canvasWrap.getBoundingClientRect();
            brushCursor.style.left = `${touch.clientX - wrapRect.left}px`;
            brushCursor.style.top = `${touch.clientY - wrapRect.top}px`;
            applyBrushStroke(touch.clientX, touch.clientY, false);
            e.preventDefault();
        });

        canvas.addEventListener('touchend', () => {
            isPainting = false;
            brushCursor.style.display = 'none';
        });

        function applyBrushStroke(clientX, clientY, isRestoreModifier) {
            const item = imageQueue[currentIndex];
            if (!item || !item.maskCanvas) return;

            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const x = (clientX - rect.left) * scaleX;
            const y = (clientY - rect.top) * scaleY;

            const mCtx = item.maskCanvas.getContext('2d');
            const shouldRestore = isRestoreModifier || brushMode === 'restore';

            if (shouldRestore) {
                // Restore original image pixels at circle
                mCtx.save();
                mCtx.beginPath();
                mCtx.arc(x, y, brushRadius, 0, Math.PI * 2);
                mCtx.clip();
                mCtx.globalCompositeOperation = 'source-over';
                mCtx.drawImage(item.originalImg, 0, 0);
                mCtx.restore();
            } else {
                // Erase background pixels
                mCtx.save();
                mCtx.beginPath();
                mCtx.arc(x, y, brushRadius, 0, Math.PI * 2);
                mCtx.globalCompositeOperation = 'destination-out';
                mCtx.fill();
                mCtx.restore();
            }

            renderCurrentImage();
        }

        // Background type changes
        bgType.addEventListener('change', () => {
            colorGroup.classList.add('hidden');
            customBgGroup.classList.add('hidden');
            blurGroup.classList.add('hidden');
            if (bgType.value === 'color') colorGroup.classList.remove('hidden');
            if (bgType.value === 'image') customBgGroup.classList.remove('hidden');
            if (bgType.value === 'blur') blurGroup.classList.remove('hidden');
            renderCurrentImage();
        });

        bgColor.addEventListener('input', renderCurrentImage);
        blurAmount.addEventListener('input', () => {
            blurVal.textContent = `${blurAmount.value}px`;
            renderCurrentImage();
        });

        customBgInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
                const img = new Image();
                img.onload = () => { customBgImage = img; renderCurrentImage(); };
                img.src = evt.target.result;
            };
            reader.readAsDataURL(file);
        });

        // Input & Clipboard Event Listeners
        imgInput.addEventListener('change', (e) => {
            addFilesToQueue(Array.from(e.target.files));
            imgInput.value = '';
        });

        window.addEventListener('paste', (e) => {
            const items = e.clipboardData?.items;
            if (!items) return;
            const files = [];
            for (const item of items) {
                if (item.type.startsWith('image/')) {
                    files.push(item.getAsFile());
                }
            }
            if (files.length > 0) addFilesToQueue(files);
        });

        window.addEventListener('dragover', (e) => e.preventDefault());
        window.addEventListener('drop', (e) => {
            e.preventDefault();
            const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
            if (files.length > 0) addFilesToQueue(files);
        });

        // Export Helper Function
        function getExportBlob(item, mimeOverride) {
            return new Promise((resolve) => {
                const mimeType = mimeOverride || exportFormat.value;
                const w = item.originalImg.naturalWidth;
                const h = item.originalImg.naturalHeight;
                const exportCanvas = document.createElement('canvas');
                exportCanvas.width = w;
                exportCanvas.height = h;
                const eCtx = exportCanvas.getContext('2d');

                // Render Background
                if (mimeType === 'image/jpeg' && bgType.value === 'transparent') {
                    // JPEG does not support transparency: fill with white to avoid black background
                    eCtx.fillStyle = '#ffffff';
                    eCtx.fillRect(0, 0, w, h);
                } else if (bgType.value === 'color') {
                    eCtx.fillStyle = bgColor.value;
                    eCtx.fillRect(0, 0, w, h);
                } else if (bgType.value === 'image' && customBgImage) {
                    const scale = Math.max(w / customBgImage.width, h / customBgImage.height);
                    const sw = customBgImage.width * scale;
                    const sh = customBgImage.height * scale;
                    eCtx.drawImage(customBgImage, (w - sw) / 2, (h - sh) / 2, sw, sh);
                } else if (bgType.value === 'blur') {
                    eCtx.save();
                    eCtx.filter = `blur(${blurAmount.value}px)`;
                    eCtx.drawImage(item.originalImg, -20, -20, w + 40, h + 40);
                    eCtx.restore();
                }

                // Render Cutout Subject
                eCtx.drawImage(item.maskCanvas, 0, 0, w, h);
                exportCanvas.toBlob(resolve, mimeType, 0.95);
            });
        }

        // Action Buttons:
        // 1. Copiar al Portapapeles
        copyBtn.addEventListener('click', async () => {
            if (currentIndex === -1 || !imageQueue[currentIndex]) return;
            try {
                const blob = await getExportBlob(imageQueue[currentIndex], 'image/png');
                await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
                const originalText = copyBtn.textContent;
                copyBtn.textContent = '¡Copiado!';
                setTimeout(() => { copyBtn.textContent = originalText; }, 1500);
            } catch (err) {
                console.error('Error al copiar al portapapeles:', err);
                alert('No se pudo copiar la imagen al portapapeles.');
            }
        });

        // 2. Descargar Imagen
        downloadSingleBtn.addEventListener('click', async () => {
            if (currentIndex === -1 || !imageQueue[currentIndex]) return;
            const item = imageQueue[currentIndex];
            const mime = exportFormat.value;
            let ext = 'png';
            if (mime === 'image/jpeg') ext = 'jpg';
            if (mime === 'image/webp') ext = 'webp';

            const blob = await getExportBlob(item);
            const baseName = item.name.replace(/\.[^/.]+$/, "");
            const link = document.createElement('a');
            link.download = `${baseName}_sin_fondo.${ext}`;
            link.href = URL.createObjectURL(blob);
            link.click();
            setTimeout(() => URL.revokeObjectURL(link.href), 1000);
        });

        // 3. Descargar Todas (.ZIP)
        downloadZipBtn.addEventListener('click', async () => {
            const readyItems = imageQueue.filter(item => item.status === 'done' && item.maskCanvas);
            if (readyItems.length === 0) return;

            const zip = new JSZip();
            downloadZipBtn.disabled = true;
            const originalZipText = downloadZipBtn.textContent;
            downloadZipBtn.textContent = 'Generando ZIP...';

            const mime = exportFormat.value;
            let ext = 'png';
            if (mime === 'image/jpeg') ext = 'jpg';
            if (mime === 'image/webp') ext = 'webp';

            for (let i = 0; i < readyItems.length; i++) {
                const item = readyItems[i];
                const blob = await getExportBlob(item);
                const seq = String(i + 1).padStart(3, '0');
                const baseName = item.name.replace(/\.[^/.]+$/, "");
                zip.file(`${seq}_${baseName}.${ext}`, blob);
            }

            const content = await zip.generateAsync({ type: 'blob' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(content);
            link.download = 'imagenes_sin_fondo.zip';
            link.click();
            setTimeout(() => URL.revokeObjectURL(link.href), 1000);

            downloadZipBtn.disabled = false;
            downloadZipBtn.textContent = originalZipText;
        });

        // 4. Borrar Imagen Seleccionada
        deleteCurrentBtn.addEventListener('click', () => {
            if (currentIndex !== -1) {
                removeImageAt(currentIndex);
            }
        });

        // 5. Limpiar Todo
        clearAllBtn.addEventListener('click', () => {
            imageQueue = [];
            currentIndex = -1;
            isProcessing = false;
            imgInput.value = '';
            brushToggle.checked = false;
            brushControls.classList.add('hidden');
            brushCursor.style.display = 'none';
            canvas.style.cursor = 'default';
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            canvas.width = 0;
            canvas.height = 0;
            statusLabel.textContent = 'Listo para procesar';
            updateButtonStates();
            renderGallery();
        });
    </script>
</body>
</html>
