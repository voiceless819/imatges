<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imatges</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
            text-align: center;
            color: #212529;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-bottom: 30px;
        }
        .header img {
            height: 48px;
            border-radius: 8px;
        }
        .header h1 {
            margin: 0;
            font-size: 32px;
        }
        .hub-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            align-items: stretch;
        }
        .hub-card {
            flex: 1;
            min-width: 300px;
            max-width: 420px;
            background: #f8f9fa;
            border: 1px solid #ced4da;
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .hub-card h2 {
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 20px;
        }
        .hub-card p {
            font-size: 14px;
            color: #6c757d;
            margin-bottom: 15px;
        }
        .preview-box {
            background: #ffffff;
            border: 2px dashed #ccc;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 15px;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas {
            max-width: 100%;
            height: auto;
            display: block;
        }
        .checker-bg {
            background-image: 
                linear-gradient(45deg, #e9ecef 25%, transparent 25%), 
                linear-gradient(-45deg, #e9ecef 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #e9ecef 75%), 
                linear-gradient(-45deg, transparent 75%, #e9ecef 75%);
            background-size: 16px 16px;
            background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
        }
        .hub-btn {
            display: block;
            padding: 10px;
            font-size: 15px;
            text-decoration: none;
            background-color: #28a745;
            color: white;
            border-radius: 5px;
            font-weight: bold;
        }
        .hub-btn:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <div class="header">
        <img src="logo.png" alt="Logo">
        <h1>Imatges</h1>
    </div>

    <div class="hub-container">
        <!-- Card 1: Marca de Agua -->
        <div class="hub-card">
            <div>
                <h2>Marca d'Aigua</h2>
                <p>Añade texto o marcas de agua en lote a tus imágenes.</p>
                <div class="preview-box">
                    <canvas id="wmPreview" width="300" height="180"></canvas>
                </div>
            </div>
            <a href="marca-de-agua.html" class="hub-btn">Abrir</a>
        </div>

        <!-- Card 2: Quitar Fondo -->
        <div class="hub-card">
            <div>
                <h2>Quitar Fondo</h2>
                <p>Quita el fondo a tus imágenes manteniendo la resolución original.</p>
                <div class="preview-box checker-bg">
                    <canvas id="bgPreview" width="300" height="180"></canvas>
                </div>
            </div>
            <a href="quitar-fondo.html" class="hub-btn">Abrir</a>
        </div>
    </div>

    <script>
        // Preview 1: Marca de Agua
        const wmCanvas = document.getElementById('wmPreview');
        const wmCtx = wmCanvas.getContext('2d');
        const w = wmCanvas.width;
        const h = wmCanvas.height;

        // Draw sample photo background
        const grad = wmCtx.createLinearGradient(0, 0, w, h);
        grad.addColorStop(0, '#3a7bd5');
        grad.addColorStop(1, '#3a6073');
        wmCtx.fillStyle = grad;
        wmCtx.fillRect(0, 0, w, h);

        // Mountain shape
        wmCtx.fillStyle = '#2c3e50';
        wmCtx.beginPath();
        wmCtx.moveTo(0, h);
        wmCtx.lineTo(w * 0.4, h * 0.45);
        wmCtx.lineTo(w * 0.7, h);
        wmCtx.fill();

        // Watermark text
        wmCtx.save();
        wmCtx.font = 'bold 22px Arial, sans-serif';
        wmCtx.fillStyle = '#ffffff';
        wmCtx.globalAlpha = 0.55;
        wmCtx.textAlign = 'center';
        wmCtx.textBaseline = 'middle';
        wmCtx.translate(w / 2, h / 2);
        wmCtx.rotate(-0.15);
        wmCtx.fillText('© Mi Marca', 0, 0);
        wmCtx.restore();

        // Preview 2: Quitar Fondo (Transparent cutout)
        const bgCanvas = document.getElementById('bgPreview');
        const bgCtx = bgCanvas.getContext('2d');
        bgCtx.clearRect(0, 0, w, h);

        // Draw a clean silhouette subject cut out on transparency
        bgCtx.fillStyle = '#343a40';
        // Head
        bgCtx.beginPath();
        bgCtx.arc(w / 2, h * 0.35, 32, 0, Math.PI * 2);
        bgCtx.fill();
        // Body / Shoulders
        bgCtx.beginPath();
        bgCtx.moveTo(w / 2 - 50, h);
        bgCtx.quadraticCurveTo(w / 2 - 40, h * 0.58, w / 2 - 25, h * 0.55);
        bgCtx.lineTo(w / 2 + 25, h * 0.55);
        bgCtx.quadraticCurveTo(w / 2 + 40, h * 0.58, w / 2 + 50, h);
        bgCtx.closePath();
        bgCtx.fill();
    </script>
</body>
</html>
