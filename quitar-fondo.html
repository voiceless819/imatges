<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quitar Fondo en Lote</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 20px auto;
            padding: 0 20px;
            text-align: center;
        }
        .header-title {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 15px;
        }
        .header-title img {
            height: 38px;
            border-radius: 6px;
        }
        .header-title h1 {
            margin: 0;
        }
        .paste-notice {
            background-color: #e9ecef;
            border: 2px dashed #6c757d;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
            color: #495057;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            align-items: flex-start;
        }
        .controls {
            flex: 1;
            min-width: 290px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-align: left;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .quick-btn-group {
            display: flex;
            gap: 5px;
            margin-top: 4px;
        }
        .quick-btn-group button {
            padding: 2px 6px;
            font-size: 12px;
            background-color: #6c757d;
        }
        .hidden {
            display: none !important;
        }
        .preview-area {
            flex: 2;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .canvas-wrap {
            position: relative;
            background-image: 
                linear-gradient(45deg, #e9ecef 25%, transparent 25%), 
                linear-gradient(-45deg, #e9ecef 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #e9ecef 75%), 
                linear-gradient(-45deg, transparent 75%, #e9ecef 75%);
            background-size: 16px 16px;
            background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
            border: 2px dashed #ccc;
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 220px;
        }
        canvas {
            max-width: 100%;
            height: auto;
            display: block;
        }
        #brushCursor {
            position: absolute;
            border: 2px solid #007bff;
            background: rgba(0, 123, 255, 0.15);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            display: none;
            z-index: 10;
        }
        .canvas-loader {
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.65);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            z-index: 8;
            pointer-events: none;
        }
        .canvas-loader-pill {
            background: #212529;
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            flex-shrink: 0;
        }
        .spinner-dark {
            width: 12px;
            height: 12px;
            border: 2px solid rgba(73,80,87,0.25);
            border-top-color: #28a745;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 6px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .gallery {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 10px 0;
            min-height: 90px;
            align-items: center;
        }
        .thumb-wrapper {
            position: relative;
            display: inline-block;
            flex-shrink: 0;
        }
        .gallery img {
            height: 70px;
            border: 2px solid transparent;
            border-radius: 4px;
            cursor: pointer;
            object-fit: cover;
            display: block;
            background: #fff;
        }
        .gallery img.active {
            border-color: #007bff;
        }
        .gallery img.is-loading {
            opacity: 0.55;
        }
        .thumb-badge {
            position: absolute;
            bottom: 3px;
            left: 3px;
            background: rgba(33, 37, 41, 0.82);
            color: #ffffff;
            font-size: 10px;
            line-height: 1;
            padding: 3px 5px;
            border-radius: 3px;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .thumb-badge.done {
            background: #28a745;
        }
        .thumb-badge.error {
            background: #dc3545;
        }
        .delete-thumb-btn {
            position: absolute;
            top: -6px;
            right: -6px;
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 12px;
            line-height: 18px;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            box-shadow: 0px 2px 4px rgba(0,0,0,0.3);
        }
        .delete-thumb-btn:hover {
            background-color: #bd2130;
        }
        .delete-current-btn {
            background-color: #dc3545;
            margin-top: 5px;
        }
        .delete-current-btn:hover {
            background-color: #bd2130;
        }
        .clear-all-btn {
            background-color: #6c757d;
            margin-top: 5px;
        }
        .clear-all-btn:hover {
            background-color: #5a6268;
        }
        button {
            padding: 10px;
            font-size: 15px;
            cursor: pointer;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        .status-box {
            background: #e9ecef;
            border-radius: 4px;
            overflow: hidden;
        }
        .status-text {
            font-size: 13px;
            color: #495057;
            padding: 6px 8px;
            text-align: center;
        }
        .status-progress {
            height: 4px;
            background: #dee2e6;
            width: 100%;
        }
        .status-progress-bar {
            height: 100%;
            background: #28a745;
            width: 0%;
            transition: width 0.15s ease;
        }
    </style>
</head>
<body>

    <div class="header-title">
        <img src="logo.png" alt="Logo">
        <h1>Quitar Fondo en Lote</h1>
    </div>

    <div class="paste-notice">
        <strong>Tip:</strong> Presiona <strong>Ctrl + V</strong> (o Cmd + V) para pegar imágenes o GIFs animados desde el portapapeles.
    </div>

    <div class="container">
        <div class="controls">
            <div class="control-group">
                <label for="imgInput">Seleccionar Imágenes o GIFs:</label>
                <input type="file" id="imgInput" accept="image/*,.gif" multiple>
            </div>

            <div class="status-box">
                <div class="status-text" id="statusLabel">Listo para procesar</div>
                <div class="status-progress hidden" id="statusProgressWrap">
                    <div class="status-progress-bar" id="statusProgressBar"></div>
                </div>
            </div>

            <div class="control-group">
                <label for="bgType">Tipo de Fondo:</label>
                <select id="bgType">
                    <option value="transparent">Transparente</option>
                    <option value="color">Color Sólido</option>
                    <option value="image">Imagen Personalizada</option>
                    <option value="blur">Desenfocar Fondo Original</option>
                </select>
            </div>

            <div class="control-group hidden" id="colorGroup">
                <label for="bgColor">Color de Fondo:</label>
                <input type="color" id="bgColor" value="#ffffff" style="height: 38px; width: 100%;">
            </div>

            <div class="control-group hidden" id="customBgGroup">
                <label for="customBgInput">Subir Imagen de Fondo:</label>
                <input type="file" id="customBgInput" accept="image/*">
            </div>

            <div class="control-group hidden" id="blurGroup">
                <label for="blurAmount">Nivel de Desenfocado: <strong id="blurVal">12px</strong></label>
                <input type="range" id="blurAmount" min="2" max="30" value="12">
            </div>

            <div class="control-group">
                <label style="cursor: pointer;">
                    <input type="checkbox" id="brushToggle"> <strong>Pincel de Retoque</strong>
                </label>
            </div>

            <div class="control-group hidden" id="brushControls">
                <div class="quick-btn-group">
                    <button type="button" id="btnErase" style="background-color: #dc3545; flex: 1;">Borrar</button>
                    <button type="button" id="btnRestore" style="background-color: #6c757d; flex: 1;">Restaurar</button>
                </div>
                <label for="brushSize" style="margin-top: 6px;">Tamaño del Pincel: <strong id="brushSizeVal">25px</strong></label>
                <input type="range" id="brushSize" min="5" max="80" value="25">
                <div class="quick-btn-group" style="margin-top: 4px;">
                    <button type="button" id="btnUndoMask" disabled style="background-color: #6c757d; flex: 1; padding: 4px;">Deshacer (Ctrl+Z)</button>
                    <button type="button" id="btnResetMask" style="background-color: #6c757d; flex: 1; padding: 4px;">Reiniciar</button>
                </div>
            </div>

            <div class="control-group">
                <label for="exportFormat">Formato de Descarga:</label>
                <select id="exportFormat">
                    <option value="image/png">PNG (.png)</option>
                    <option value="image/gif">GIF (.gif — Mantiene animación)</option>
                    <option value="image/jpeg">JPEG (.jpg)</option>
                    <option value="image/webp">WEBP (.webp)</option>
                </select>
            </div>

            <button id="copyBtn" disabled style="background-color: #007bff; margin-bottom: 5px;">Copiar al Portapapeles</button>
            <button id="downloadSingleBtn" disabled style="margin-bottom: 5px;">Descargar Imagen</button>
            <button id="downloadZipBtn" disabled>Descargar Todas (.ZIP)</button>
            <button id="clearAllBtn" class="clear-all-btn">Limpiar Todo</button>
        </div>

        <div class="preview-area">
            <div class="gallery" id="gallery"></div>
            <div class="canvas-wrap" id="canvasWrap">
                <div id="brushCursor"></div>
                <div class="canvas-loader hidden" id="canvasLoader">
                    <div class="canvas-loader-pill">
                        <div class="spinner"></div>
                        <span id="canvasLoaderText">Quitando fondo...</span>
                    </div>
                </div>
                <canvas id="canvas"></canvas>
            </div>
            <button id="deleteCurrentBtn" class="delete-current-btn" disabled>Borrar Imagen Seleccionada</button>
        </div>
    </div>

    <script type="module">
        import { preload, removeBackground } from 'https://esm.sh/@imgly/background-removal@1.4.5';

        const imgInput = document.getElementById('imgInput');
        const statusLabel = document.getElementById('statusLabel');
        const statusProgressWrap = document.getElementById('statusProgressWrap');
        const statusProgressBar = document.getElementById('statusProgressBar');

        const bgType = document.getElementById('bgType');
        const colorGroup = document.getElementById('colorGroup');
        const bgColor = document.getElementById('bgColor');
        const customBgGroup = document.getElementById('customBgGroup');
        const customBgInput = document.getElementById('customBgInput');
        const blurGroup = document.getElementById('blurGroup');
        const blurAmount = document.getElementById('blurAmount');
        const blurVal = document.getElementById('blurVal');

        const brushToggle = document.getElementById('brushToggle');
        const brushControls = document.getElementById('brushControls');
        const btnErase = document.getElementById('btnErase');
        const btnRestore = document.getElementById('btnRestore');
        const brushSize = document.getElementById('brushSize');
        const brushSizeVal = document.getElementById('brushSizeVal');
        const btnUndoMask = document.getElementById('btnUndoMask');
        const btnResetMask = document.getElementById('btnResetMask');
        const brushCursor = document.getElementById('brushCursor');

        const exportFormat = document.getElementById('exportFormat');
        const copyBtn = document.getElementById('copyBtn');
        const downloadSingleBtn = document.getElementById('downloadSingleBtn');
        const downloadZipBtn = document.getElementById('downloadZipBtn');
        const clearAllBtn = document.getElementById('clearAllBtn');
        const deleteCurrentBtn = document.getElementById('deleteCurrentBtn');

        const canvasWrap = document.getElementById('canvasWrap');
        const canvasLoader = document.getElementById('canvasLoader');
        const canvasLoaderText = document.getElementById('canvasLoaderText');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const gallery = document.getElementById('gallery');

        canvas.style.maxWidth = '100%';
        canvas.style.maxHeight = '100%';
        canvas.style.objectFit = 'contain';

        const MAX_CONCURRENCY = 3;
        const AI_MAX_DIM = 1024;
        const AI_GIF_MAX_DIM = 512; // Más rápido por fotograma en GIFs animados

        let imageQueue = [];
        let currentIndex = -1;
        let activeWorkers = 0;
        let queueGeneration = 0;
        let pasteCounter = 1;

        let customBgImage = null;
        let isBrushActive = false;
        let brushMode = 'erase';
        let brushRadius = 25;
        let isPainting = false;
        let lastPaintPoint = null;

        // Animated GIF Playback Timer
        let animTimer = null;
        let currentFrameIdx = 0;

        // AI Preload & Progress
        let aiReady = false;
        let aiPreloadPromise = null;
        let downloadProgressMap = new Map();
        let lastDownloadPct = 0;

        const AI_CONFIG = {
            model: 'small',
            output: { format: 'image/png', quality: 1 },
            progress: (key, current, total) => {
                if (key && key.startsWith('fetch:') && total > 0) {
                    downloadProgressMap.set(key, { current, total });
                    let sumCur = 0, sumTot = 0;
                    downloadProgressMap.forEach(v => { sumCur += v.current; sumTot += v.total; });
                    lastDownloadPct = Math.min(99, Math.round((sumCur / sumTot) * 100));
                    if (!aiReady && activeWorkers > 0) {
                        updateGlobalStatus();
                    }
                }
            }
        };

        function ensureAIReady() {
            if (aiReady) return Promise.resolve();
            if (!aiPreloadPromise) {
                aiPreloadPromise = preload(AI_CONFIG)
                    .then(() => { aiReady = true; })
                    .catch((err) => {
                        console.warn('Aviso al precargar IA:', err);
                        aiPreloadPromise = null;
                    });
            }
            return aiPreloadPromise;
        }

        window.addEventListener('DOMContentLoaded', () => {
            ensureAIReady();
        });

        // ==========================================
        // DECODIFICADOR Y CODIFICADOR DE GIF ANIMADO
        // ==========================================

        // Pure-JS GIF89a Frame Decoder fallback
        function decodeGifBinary(buffer) {
            const bytes = new Uint8Array(buffer);
            if (bytes.length < 13) return null;
            const header = String.fromCharCode(bytes[0], bytes[1], bytes[2]);
            if (header !== 'GIF') return null;

            const width = bytes[6] | (bytes[7] << 8);
            const height = bytes[8] | (bytes[9] << 8);
            const packed = bytes[10];
            let pos = 13;

            let gct = null;
            if (packed & 0x80) {
                const gctSize = 1 << ((packed & 0x07) + 1);
                gct = bytes.subarray(pos, pos + gctSize * 3);
                pos += gctSize * 3;
            }

            const frames = [];
            const accumCanvas = document.createElement('canvas');
            accumCanvas.width = width;
            accumCanvas.height = height;
            const accumCtx = accumCanvas.getContext('2d');

            let delayMs = 100;
            let disposal = 0;
            let transIndex = -1;

            while (pos < bytes.length) {
                const blockId = bytes[pos++];
                if (blockId === 0x3B) break; // Trailer

                if (blockId === 0x21) { // Extension
                    const extLabel = bytes[pos++];
                    if (extLabel === 0xF9) { // Graphic Control Extension
                        const blockSize = bytes[pos++];
                        const gcePacked = bytes[pos];
                        disposal = (gcePacked >> 2) & 0x07;
                        const hasTrans = (gcePacked & 0x01) !== 0;
                        const delayCs = bytes[pos + 1] | (bytes[pos + 2] << 8);
                        delayMs = Math.max(20, (delayCs || 10) * 10);
                        transIndex = hasTrans ? bytes[pos + 3] : -1;
                        pos += blockSize + 1;
                    } else {
                        while (pos < bytes.length) {
                            const subLen = bytes[pos++];
                            if (subLen === 0) break;
                            pos += subLen;
                        }
                    }
                } else if (blockId === 0x2C) { // Image Descriptor
                    const left = bytes[pos] | (bytes[pos + 1] << 8);
                    const top = bytes[pos + 2] | (bytes[pos + 3] << 8);
                    const fw = bytes[pos + 4] | (bytes[pos + 5] << 8);
                    const fh = bytes[pos + 6] | (bytes[pos + 7] << 8);
                    const imgPacked = bytes[pos + 8];
                    pos += 9;

                    let ct = gct;
                    if (imgPacked & 0x80) {
                        const lctSize = 1 << ((imgPacked & 0x07) + 1);
                        ct = bytes.subarray(pos, pos + lctSize * 3);
                        pos += lctSize * 3;
                    }
                    const interlaced = (imgPacked & 0x40) !== 0;

                    const minCodeSize = bytes[pos++];
                    const lzwBytes = [];
                    while (pos < bytes.length) {
                        const subLen = bytes[pos++];
                        if (subLen === 0) break;
                        for (let i = 0; i < subLen; i++) lzwBytes.push(bytes[pos++]);
                    }

                    // LZW Decode
                    const clearCode = 1 << minCodeSize;
                    const eoiCode = clearCode + 1;
                    let codeSize = minCodeSize + 1;
                    let nextCode = eoiCode + 1;
                    let codeMask = (1 << codeSize) - 1;

                    const prefix = new Int32Array(4096);
                    const suffix = new Uint8Array(4096);
                    const lengthArr = new Int32Array(4096);
                    for (let i = 0; i < clearCode; i++) {
                        prefix[i] = -1;
                        suffix[i] = i;
                        lengthArr[i] = 1;
                    }

                    const pixelCount = fw * fh;
                    const pixels = new Uint8Array(pixelCount);
                    let pixelPos = 0;
                    let bitBuf = 0, bitCnt = 0, byteIdx = 0;
                    let oldCode = -1, firstChar = 0;
                    const stack = new Uint8Array(4096);

                    while (byteIdx < lzwBytes.length || bitCnt >= codeSize) {
                        while (bitCnt < codeSize && byteIdx < lzwBytes.length) {
                            bitBuf |= lzwBytes[byteIdx++] << bitCnt;
                            bitCnt += 8;
                        }
                        if (bitCnt < codeSize) break;
                        const code = bitBuf & codeMask;
                        bitBuf >>= codeSize;
                        bitCnt -= codeSize;

                        if (code === clearCode) {
                            codeSize = minCodeSize + 1;
                            codeMask = (1 << codeSize) - 1;
                            nextCode = eoiCode + 1;
                            oldCode = -1;
                            continue;
                        }
                        if (code === eoiCode) break;

                        let inCode = code;
                        let sp = 0;
                        if (code >= nextCode) {
                            stack[sp++] = firstChar;
                            inCode = oldCode;
                        }
                        while (inCode >= clearCode && sp < 4096) {
                            stack[sp++] = suffix[inCode];
                            inCode = prefix[inCode];
                        }
                        firstChar = suffix[inCode];
                        stack[sp++] = firstChar;

                        for (let i = sp - 1; i >= 0 && pixelPos < pixelCount; i--) {
                            pixels[pixelPos++] = stack[i];
                        }

                        if (oldCode !== -1 && nextCode < 4096) {
                            prefix[nextCode] = oldCode;
                            suffix[nextCode] = firstChar;
                            nextCode++;
                            if (nextCode === (1 << codeSize) && codeSize < 12) {
                                codeSize++;
                                codeMask = (1 << codeSize) - 1;
                            }
                        }
                        oldCode = code;
                    }

                    let prevSnapshot = null;
                    if (disposal === 3) {
                        prevSnapshot = accumCtx.getImageData(0, 0, width, height);
                    }

                    const frameImgData = accumCtx.getImageData(left, top, fw, fh);
                    const fd = frameImgData.data;

                    const passStarts = [0, 4, 2, 1];
                    const passSteps = [8, 8, 4, 2];
                    let srcRow = 0;

                    const writeRow = (destY) => {
                        for (let x = 0; x < fw; x++) {
                            const cIdx = pixels[srcRow * fw + x];
                            if (cIdx !== transIndex && ct) {
                                const di = (destY * fw + x) * 4;
                                fd[di] = ct[cIdx * 3];
                                fd[di + 1] = ct[cIdx * 3 + 1];
                                fd[di + 2] = ct[cIdx * 3 + 2];
                                fd[di + 3] = 255;
                            }
                        }
                        srcRow++;
                    };

                    if (!interlaced) {
                        for (let y = 0; y < fh; y++) writeRow(y);
                    } else {
                        for (let p = 0; p < 4; p++) {
                            for (let y = passStarts[p]; y < fh; y += passSteps[p]) writeRow(y);
                        }
                    }

                    accumCtx.putImageData(frameImgData, left, top);

                    const frameCanvas = document.createElement('canvas');
                    frameCanvas.width = width;
                    frameCanvas.height = height;
                    frameCanvas.getContext('2d').drawImage(accumCanvas, 0, 0);
                    frames.push({ canvas: frameCanvas, delayMs });

                    if (disposal === 2) {
                        accumCtx.clearRect(left, top, fw, fh);
                    } else if (disposal === 3 && prevSnapshot) {
                        accumCtx.putImageData(prevSnapshot, 0, 0);
                    }

                    delayMs = 100;
                    disposal = 0;
                    transIndex = -1;
                } else {
                    break;
                }
            }
            return frames.length > 1 ? frames : null;
        }

        async function decodeAnimatedGifIfApplicable(file) {
            const isGif = (file.type === 'image/gif') || /\.gif$/i.test(file.name || '');
            if (!isGif) return null;

            const buf = await file.arrayBuffer();

            // 1. Try native ImageDecoder first
            if ('ImageDecoder' in window) {
                try {
                    const decoder = new ImageDecoder({ data: buf.slice(0), type: 'image/gif' });
                    await decoder.tracks.ready;
                    const track = decoder.tracks.selectedTrack;
                    const count = track.frameCount;
                    if (count > 1) {
                        const frames = [];
                        for (let i = 0; i < count; i++) {
                            const { image } = await decoder.decode({ frameIndex: i });
                            const c = document.createElement('canvas');
                            c.width = image.displayWidth;
                            c.height = image.displayHeight;
                            c.getContext('2d').drawImage(image, 0, 0);
                            const delayMs = image.duration ? Math.max(20, Math.round(image.duration / 1000)) : 100;
                            image.close();
                            frames.push({ canvas: c, delayMs });
                        }
                        decoder.close();
                        return frames;
                    }
                    decoder.close();
                } catch (e) {
                    console.warn('Usando decodificador GIF binario JS:', e);
                }
            }

            // 2. Fallback to pure-JS GIF89a decoder
            return decodeGifBinary(buf);
        }

        // Multi-frame GIF89a Encoder with transparency & Floyd-Steinberg dithering
        function encodeAnimatedGIF(frameItems) {
            const w = frameItems[0].canvas.width;
            const h = frameItems[0].canvas.height;
            const bytes = [];
            const pushStr = (s) => { for (let i = 0; i < s.length; i++) bytes.push(s.charCodeAt(i)); };
            const push16 = (v) => { bytes.push(v & 0xFF, (v >> 8) & 0xFF); };

            pushStr('GIF89a');
            push16(w);
            push16(h);
            bytes.push(0xF7, 0xFF, 0x00);

            for (let r = 0; r < 6; r++) {
                for (let g = 0; g < 6; g++) {
                    for (let b = 0; b < 6; b++) {
                        bytes.push(r * 51, g * 51, b * 51);
                    }
                }
            }
            for (let i = 0; i < 39; i++) {
                const v = Math.round((i / 38) * 255);
                bytes.push(v, v, v);
            }
            bytes.push(0, 0, 0); // 255 = transparent

            if (frameItems.length > 1) {
                bytes.push(0x21, 0xFF, 0x0B);
                pushStr('NETSCAPE2.0');
                bytes.push(0x03, 0x01, 0x00, 0x00, 0x00);
            }

            const totalPixels = w * h;
            const dict = new Int32Array(4096 * 256);

            for (const fItem of frameItems) {
                const c = fItem.canvas;
                const delayCs = Math.max(2, Math.round((fItem.delayMs || 100) / 10));
                const imgData = c.getContext('2d').getImageData(0, 0, w, h).data;

                const rBuf = new Float32Array(totalPixels);
                const gBuf = new Float32Array(totalPixels);
                const bBuf = new Float32Array(totalPixels);
                for (let i = 0; i < totalPixels; i++) {
                    const p = i * 4;
                    rBuf[i] = imgData[p];
                    gBuf[i] = imgData[p + 1];
                    bBuf[i] = imgData[p + 2];
                }

                const indices = new Uint8Array(totalPixels);
                let hasTransparent = false;

                for (let y = 0; y < h; y++) {
                    for (let x = 0; x < w; x++) {
                        const i = y * w + x;
                        if (imgData[i * 4 + 3] < 128) {
                            indices[i] = 255;
                            hasTransparent = true;
                            continue;
                        }
                        const oldR = Math.max(0, Math.min(255, rBuf[i]));
                        const oldG = Math.max(0, Math.min(255, gBuf[i]));
                        const oldB = Math.max(0, Math.min(255, bBuf[i]));

                        const qr = Math.round(oldR / 51);
                        const qg = Math.round(oldG / 51);
                        const qb = Math.round(oldB / 51);
                        indices[i] = qr * 36 + qg * 6 + qb;

                        const errR = oldR - qr * 51;
                        const errG = oldG - qg * 51;
                        const errB = oldB - qb * 51;
                        if (x + 1 < w) {
                            const ni = i + 1;
                            rBuf[ni] += errR * 0.4375; gBuf[ni] += errG * 0.4375; bBuf[ni] += errB * 0.4375;
                        }
                        if (y + 1 < h) {
                            if (x > 0) {
                                const ni = i + w - 1;
                                rBuf[ni] += errR * 0.1875; gBuf[ni] += errG * 0.1875; bBuf[ni] += errB * 0.1875;
                            }
                            const ni2 = i + w;
                            rBuf[ni2] += errR * 0.3125; gBuf[ni2] += errG * 0.3125; bBuf[ni2] += errB * 0.3125;
                            if (x + 1 < w) {
                                const ni3 = i + w + 1;
                                rBuf[ni3] += errR * 0.0625; gBuf[ni3] += errG * 0.0625; bBuf[ni3] += errB * 0.0625;
                            }
                        }
                    }
                }

                const gceFlags = (2 << 2) | (hasTransparent ? 1 : 0);
                bytes.push(0x21, 0xF9, 0x04, gceFlags);
                push16(delayCs);
                bytes.push(255, 0x00);

                bytes.push(0x2C);
                push16(0); push16(0);
                push16(w); push16(h);
                bytes.push(0x00);

                bytes.push(8);
                const clearCode = 256;
                const eoiCode = 257;
                let codeSize = 9;
                let nextCode = 258;
                dict.fill(-1);

                let bitBuffer = 0;
                let bitCount = 0;
                let subBlock = [];

                const emitCode = (code) => {
                    bitBuffer |= (code << bitCount);
                    bitCount += codeSize;
                    while (bitCount >= 8) {
                        subBlock.push(bitBuffer & 0xFF);
                        bitBuffer >>= 8;
                        bitCount -= 8;
                        if (subBlock.length === 255) {
                            bytes.push(255, ...subBlock);
                            subBlock = [];
                        }
                    }
                };

                emitCode(clearCode);
                let prefix = indices[0];
                for (let i = 1; i < totalPixels; i++) {
                    const k = indices[i];
                    const dictIdx = (prefix << 8) + k;
                    if (dict[dictIdx] !== -1) {
                        prefix = dict[dictIdx];
                    } else {
                        emitCode(prefix);
                        if (nextCode < 4096) {
                            dict[dictIdx] = nextCode++;
                            if (nextCode > (1 << codeSize) && codeSize < 12) {
                                codeSize++;
                            }
                        } else {
                            emitCode(clearCode);
                            dict.fill(-1);
                            nextCode = 258;
                            codeSize = 9;
                        }
                        prefix = k;
                    }
                }
                emitCode(prefix);
                emitCode(eoiCode);

                if (bitCount > 0) subBlock.push(bitBuffer & 0xFF);
                if (subBlock.length > 0) bytes.push(subBlock.length, ...subBlock);
                bytes.push(0x00);
            }

            bytes.push(0x3B);
            return new Blob([new Uint8Array(bytes)], { type: 'image/gif' });
        }

        // Update status bar & canvas loader overlay
        function updateGlobalStatus() {
            const total = imageQueue.length;
            if (total === 0) {
                statusLabel.innerHTML = 'Listo para procesar';
                statusProgressWrap.classList.add('hidden');
                statusProgressBar.style.width = '0%';
                canvasLoader.classList.add('hidden');
                return;
            }

            const doneCount = imageQueue.filter(i => i.status === 'done').length;
            const errorCount = imageQueue.filter(i => i.status === 'error').length;
            const finishedCount = doneCount + errorCount;
            const inProgressCount = imageQueue.filter(i => i.status === 'processing' || i.status === 'pending').length;

            const currentItem = imageQueue[currentIndex];

            if (inProgressCount > 0) {
                statusProgressWrap.classList.remove('hidden');
                if (!aiReady && lastDownloadPct > 0 && lastDownloadPct < 99) {
                    statusLabel.innerHTML = `<span class="spinner-dark"></span>Descargando IA (1ª vez): ${lastDownloadPct}% (${finishedCount}/${total} listas)`;
                    statusProgressBar.style.width = `${lastDownloadPct}%`;
                } else if (currentItem && currentItem.isAnimated && currentItem.status === 'processing') {
                    const fDone = currentItem.framesProcessed || 0;
                    const fTot = currentItem.frames.length;
                    const pct = Math.max(8, Math.round((fDone / fTot) * 100));
                    statusLabel.innerHTML = `<span class="spinner-dark"></span>Quitando fondo al GIF (${fDone}/${fTot} fotogramas)...`;
                    statusProgressBar.style.width = `${pct}%`;
                } else {
                    const pct = Math.max(10, Math.round((finishedCount / total) * 100));
                    statusLabel.innerHTML = `<span class="spinner-dark"></span>Quitando fondo (${finishedCount}/${total} listas, ${activeWorkers} en paralelo)...`;
                    statusProgressBar.style.width = `${pct}%`;
                }
            } else {
                statusProgressWrap.classList.add('hidden');
                statusProgressBar.style.width = '100%';
                if (errorCount > 0 && doneCount === 0) {
                    statusLabel.textContent = `Error al procesar (${errorCount} fallidas)`;
                } else if (errorCount > 0) {
                    statusLabel.textContent = `Completado (${doneCount} listas, ${errorCount} con error)`;
                } else {
                    statusLabel.textContent = `Completado (${doneCount} ${doneCount === 1 ? 'archivo procesado' : 'archivos procesados'})`;
                }
            }

            if (currentItem && (currentItem.status === 'pending' || currentItem.status === 'processing')) {
                canvasLoader.classList.remove('hidden');
                if (!aiReady && lastDownloadPct > 0 && lastDownloadPct < 99) {
                    canvasLoaderText.textContent = `Descargando motor IA (${lastDownloadPct}%)...`;
                } else if (currentItem.isAnimated) {
                    canvasLoaderText.textContent = `Quitando fondo al GIF (${currentItem.framesProcessed || 0}/${currentItem.frames.length} fotogramas)...`;
                } else {
                    canvasLoaderText.textContent = `Quitando fondo a "${currentItem.name}"...`;
                }
            } else {
                canvasLoader.classList.add('hidden');
            }
        }

        function prepareAIInputBlob(sourceImgOrCanvas, maxDim = AI_MAX_DIM) {
            return new Promise((resolve) => {
                const w = sourceImgOrCanvas.naturalWidth || sourceImgOrCanvas.width;
                const h = sourceImgOrCanvas.naturalHeight || sourceImgOrCanvas.height;
                const scale = Math.min(1, maxDim / Math.max(w, h));
                const targetW = Math.max(1, Math.round(w * scale));
                const targetH = Math.max(1, Math.round(h * scale));

                const c = document.createElement('canvas');
                c.width = targetW;
                c.height = targetH;
                const tCtx = c.getContext('2d');
                tCtx.drawImage(sourceImgOrCanvas, 0, 0, targetW, targetH);
                c.toBlob(resolve, 'image/png');
            });
        }

        async function buildFullResMaskCanvas(sourceImgOrCanvas, cutoutBlob) {
            const w = sourceImgOrCanvas.naturalWidth || sourceImgOrCanvas.width;
            const h = sourceImgOrCanvas.naturalHeight || sourceImgOrCanvas.height;

            const maskCanvas = document.createElement('canvas');
            maskCanvas.width = w;
            maskCanvas.height = h;
            const mCtx = maskCanvas.getContext('2d');
            mCtx.imageSmoothingEnabled = true;
            mCtx.imageSmoothingQuality = 'high';

            mCtx.drawImage(sourceImgOrCanvas, 0, 0, w, h);

            mCtx.globalCompositeOperation = 'destination-in';
            if (window.createImageBitmap) {
                const bmp = await createImageBitmap(cutoutBlob);
                mCtx.drawImage(bmp, 0, 0, w, h);
                bmp.close();
            } else {
                const cutoutImg = await new Promise((res, rej) => {
                    const url = URL.createObjectURL(cutoutBlob);
                    const i = new Image();
                    i.onload = () => { URL.revokeObjectURL(url); res(i); };
                    i.onerror = (e) => { URL.revokeObjectURL(url); rej(e); };
                    i.src = url;
                });
                mCtx.drawImage(cutoutImg, 0, 0, w, h);
            }
            mCtx.globalCompositeOperation = 'source-over';
            return maskCanvas;
        }

        function fallbackLocalRemoval(sourceImgOrCanvas) {
            return new Promise((resolve) => {
                const c = document.createElement('canvas');
                const w = sourceImgOrCanvas.naturalWidth || sourceImgOrCanvas.width;
                const h = sourceImgOrCanvas.naturalHeight || sourceImgOrCanvas.height;
                c.width = w;
                c.height = h;
                const tCtx = c.getContext('2d');
                tCtx.drawImage(sourceImgOrCanvas, 0, 0, w, h);
                const data = tCtx.getImageData(0, 0, w, h);
                const d = data.data;
                const r = d[0], g = d[1], b = d[2];
                for (let i = 0; i < d.length; i += 4) {
                    const dist = Math.hypot(d[i] - r, d[i + 1] - g, d[i + 2] - b);
                    if (dist < 36) d[i + 3] = 0;
                    else if (dist < 50) d[i + 3] = Math.round(((dist - 36) / 14) * 255);
                }
                tCtx.putImageData(data, 0, 0);
                c.toBlob(resolve, 'image/png');
            });
        }

        async function addFilesToQueue(files) {
            if (!files || files.length === 0) return;

            for (const file of files) {
                if (!file) continue;
                const isGifFile = (file.type === 'image/gif') || /\.gif$/i.test(file.name || '');
                if (!isGifFile && (!file.type || !file.type.startsWith('image/'))) continue;

                try {
                    const objUrl = URL.createObjectURL(file);
                    const img = await new Promise((res, rej) => {
                        const i = new Image();
                        i.onload = () => res(i);
                        i.onerror = rej;
                        i.src = objUrl;
                    });

                    const gifFrames = await decodeAnimatedGifIfApplicable(file);
                    const isAnimated = Boolean(gifFrames && gifFrames.length > 1);

                    const item = {
                        id: `${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
                        name: file.name || `imagen_${pasteCounter++}.${isAnimated ? 'gif' : 'png'}`,
                        objUrl: objUrl,
                        originalFile: file,
                        originalImg: img,
                        isAnimated: isAnimated,
                        frames: isAnimated ? gifFrames.map(f => ({
                            origCanvas: f.canvas,
                            maskCanvas: null,
                            maskBlob: null,
                            delayMs: f.delayMs
                        })) : null,
                        framesProcessed: 0,
                        maskCanvas: null,
                        maskBlob: null,
                        undoStack: [],
                        status: 'pending'
                    };
                    imageQueue.push(item);

                    if (isAnimated) {
                        exportFormat.value = 'image/gif';
                    }
                } catch (err) {
                    console.error('Error cargando archivo:', err);
                }
            }

            if (currentIndex === -1 && imageQueue.length > 0) {
                currentIndex = 0;
            }

            renderGallery();
            manageAnimationLoop();
            renderCurrentImage();
            updateGlobalStatus();
            scheduleQueue();
        }

        function scheduleQueue() {
            const gen = queueGeneration;
            while (activeWorkers < MAX_CONCURRENCY) {
                const nextItem = imageQueue.find(item => item.status === 'pending');
                if (!nextItem) break;
                processSingleItem(nextItem, gen);
            }
        }

        async function removeBgFromSource(sourceEl, maxDim) {
            const aiInputBlob = await prepareAIInputBlob(sourceEl, maxDim);
            let blobSinFondo;
            try {
                blobSinFondo = await removeBackground(aiInputBlob, AI_CONFIG);
                aiReady = true;
            } catch (aiErr) {
                console.warn('Usando recorte alternativo local:', aiErr);
                blobSinFondo = await fallbackLocalRemoval(sourceEl);
            }
            const maskCanvas = await buildFullResMaskCanvas(sourceEl, blobSinFondo);
            return { maskCanvas, maskBlob: blobSinFondo };
        }

        async function processSingleItem(item, gen) {
            item.status = 'processing';
            activeWorkers++;
            updateGalleryBadge(item);
            updateGlobalStatus();

            try {
                await ensureAIReady();
                if (gen !== queueGeneration || !imageQueue.includes(item)) return;

                if (item.isAnimated && item.frames) {
                    item.framesProcessed = 0;
                    for (let fIdx = 0; fIdx < item.frames.length; fIdx++) {
                        if (gen !== queueGeneration || !imageQueue.includes(item)) return;
                        const frame = item.frames[fIdx];
                        const { maskCanvas, maskBlob } = await removeBgFromSource(frame.origCanvas, AI_GIF_MAX_DIM);
                        frame.maskCanvas = maskCanvas;
                        frame.maskBlob = maskBlob;
                        item.framesProcessed = fIdx + 1;
                        if (fIdx === 0) {
                            item.maskCanvas = maskCanvas;
                            item.maskBlob = maskBlob;
                        }
                        updateGalleryBadge(item);
                        updateGlobalStatus();
                    }
                    item.undoStack = [];
                    item.status = 'done';
                } else {
                    const { maskCanvas, maskBlob } = await removeBgFromSource(item.originalImg, AI_MAX_DIM);
                    if (gen !== queueGeneration || !imageQueue.includes(item)) return;
                    item.maskBlob = maskBlob;
                    item.maskCanvas = maskCanvas;
                    item.undoStack = [];
                    item.status = 'done';
                }
            } catch (err) {
                console.error('Error procesando imagen:', err);
                item.status = 'error';
            } finally {
                if (gen === queueGeneration) {
                    activeWorkers = Math.max(0, activeWorkers - 1);
                    updateGalleryBadge(item);
                    if (imageQueue[currentIndex] === item) {
                        manageAnimationLoop();
                        renderCurrentImage();
                    }
                    updateButtonStates();
                    updateGlobalStatus();
                    scheduleQueue();
                }
            }
        }

        function manageAnimationLoop() {
            if (animTimer) {
                clearTimeout(animTimer);
                animTimer = null;
            }
            const item = imageQueue[currentIndex];
            if (!item || !item.isAnimated || item.status !== 'done' || !item.frames || item.frames.length <= 1) {
                currentFrameIdx = 0;
                return;
            }

            const tick = () => {
                const cur = imageQueue[currentIndex];
                if (!cur || !cur.isAnimated || cur.status !== 'done') return;
                currentFrameIdx = (currentFrameIdx + 1) % cur.frames.length;
                renderCurrentImage(true);
                const delay = cur.frames[currentFrameIdx]?.delayMs || 100;
                animTimer = setTimeout(tick, delay);
            };
            const initialDelay = item.frames[currentFrameIdx]?.delayMs || 100;
            animTimer = setTimeout(tick, initialDelay);
        }

        function renderCompositeOnto(targetCtx, w, h, origSource, maskSource, forceWhiteIfTransparent = false) {
            targetCtx.clearRect(0, 0, w, h);

            if (forceWhiteIfTransparent) {
                targetCtx.fillStyle = '#ffffff';
                targetCtx.fillRect(0, 0, w, h);
            }

            if (bgType.value === 'color') {
                targetCtx.fillStyle = bgColor.value;
                targetCtx.fillRect(0, 0, w, h);
            } else if (bgType.value === 'image' && customBgImage) {
                const scale = Math.max(w / customBgImage.width, h / customBgImage.height);
                const sw = customBgImage.width * scale;
                const sh = customBgImage.height * scale;
                targetCtx.drawImage(customBgImage, (w - sw) / 2, (h - sh) / 2, sw, sh);
            } else if (bgType.value === 'blur') {
                const scaledBlur = Math.max(2, Math.round(parseInt(blurAmount.value, 10) * (Math.max(w, h) / 1000)));
                targetCtx.save();
                targetCtx.filter = `blur(${scaledBlur}px)`;
                targetCtx.drawImage(origSource, 0, 0, w, h);
                targetCtx.restore();
            }

            targetCtx.drawImage(maskSource, 0, 0, w, h);
        }

        function renderCurrentImage(fromAnimTick = false) {
            if (currentIndex === -1 || !imageQueue[currentIndex]) {
                canvas.width = 0;
                canvas.height = 0;
                updateButtonStates();
                updateGlobalStatus();
                return;
            }

            const item = imageQueue[currentIndex];
            const w = item.originalImg.naturalWidth || item.originalImg.width;
            const h = item.originalImg.naturalHeight || item.originalImg.height;

            if (canvas.width !== w || canvas.height !== h) {
                canvas.width = w;
                canvas.height = h;
            }

            if (item.status !== 'done' || !item.maskCanvas) {
                ctx.clearRect(0, 0, w, h);
                ctx.save();
                ctx.globalAlpha = 0.65;
                ctx.drawImage(item.originalImg, 0, 0, w, h);
                ctx.restore();
                updateButtonStates();
                updateGlobalStatus();
                return;
            }

            if (item.isAnimated && item.frames && item.frames.length > 0) {
                const f = item.frames[currentFrameIdx % item.frames.length];
                renderCompositeOnto(ctx, w, h, f.origCanvas, f.maskCanvas || f.origCanvas, false);
            } else {
                renderCompositeOnto(ctx, w, h, item.originalImg, item.maskCanvas, false);
            }

            if (!fromAnimTick) {
                updateButtonStates();
                updateGlobalStatus();
            }
        }

        function renderGallery() {
            gallery.innerHTML = '';
            imageQueue.forEach((item, index) => {
                const wrap = document.createElement('div');
                wrap.className = 'thumb-wrapper';
                wrap.dataset.id = item.id;

                const thumb = document.createElement('img');
                thumb.src = item.originalImg.src;
                if (index === currentIndex) thumb.classList.add('active');
                if (item.status === 'pending' || item.status === 'processing') {
                    thumb.classList.add('is-loading');
                }

                thumb.addEventListener('click', () => {
                    currentIndex = imageQueue.indexOf(item);
                    currentFrameIdx = 0;
                    if (item.isAnimated) exportFormat.value = 'image/gif';
                    updateActiveThumbnail();
                    manageAnimationLoop();
                    renderCurrentImage();
                });

                const badge = document.createElement('div');
                badge.className = 'thumb-badge';
                applyBadgeState(badge, thumb, item);

                const delBtn = document.createElement('button');
                delBtn.className = 'delete-thumb-btn';
                delBtn.innerHTML = '&times;';
                delBtn.title = 'Borrar imagen';
                delBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    removeImageAt(imageQueue.indexOf(item));
                });

                wrap.appendChild(thumb);
                wrap.appendChild(badge);
                wrap.appendChild(delBtn);
                gallery.appendChild(wrap);
            });
        }

        function applyBadgeState(badge, thumb, item) {
            const status = item.status;
            const prefix = item.isAnimated ? 'GIF ' : '';
            badge.className = 'thumb-badge';
            if (status === 'pending' || status === 'processing') {
                thumb.classList.add('is-loading');
                const progressTxt = item.isAnimated ? `${item.framesProcessed || 0}/${item.frames.length}` : '';
                badge.innerHTML = `<span class="spinner" style="width:10px;height:10px;border-width:2px;"></span>${progressTxt}`;
            } else if (status === 'done') {
                thumb.classList.remove('is-loading');
                badge.classList.add('done');
                badge.textContent = prefix + 'OK';
            } else if (status === 'error') {
                thumb.classList.remove('is-loading');
                badge.classList.add('error');
                badge.textContent = '!';
            }
        }

        function updateGalleryBadge(item) {
            const wrap = gallery.querySelector(`.thumb-wrapper[data-id="${item.id}"]`);
            if (!wrap) return;
            const thumb = wrap.querySelector('img');
            const badge = wrap.querySelector('.thumb-badge');
            if (thumb && badge) {
                applyBadgeState(badge, thumb, item);
            }
        }

        function updateActiveThumbnail() {
            const thumbs = gallery.querySelectorAll('.thumb-wrapper img');
            thumbs.forEach((img, idx) => {
                if (idx === currentIndex) {
                    img.classList.add('active');
                    img.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                } else {
                    img.classList.remove('active');
                }
            });
        }

        function updateButtonStates() {
            const currentItem = imageQueue[currentIndex];
            const currentReady = Boolean(currentItem && currentItem.status === 'done' && currentItem.maskCanvas);
            const anyReady = imageQueue.some(i => i.status === 'done' && i.maskCanvas);

            copyBtn.disabled = !currentReady;
            downloadSingleBtn.disabled = !currentReady;
            downloadZipBtn.disabled = !anyReady;
            deleteCurrentBtn.disabled = !currentItem;
            btnUndoMask.disabled = !(currentReady && currentItem.undoStack && currentItem.undoStack.length > 0);
        }

        function removeImageAt(index) {
            if (index < 0 || index >= imageQueue.length) return;
            const [removed] = imageQueue.splice(index, 1);
            if (removed && removed.objUrl) {
                URL.revokeObjectURL(removed.objUrl);
            }
            if (imageQueue.length === 0) {
                currentIndex = -1;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                canvas.width = 0;
                canvas.height = 0;
            } else if (currentIndex >= imageQueue.length) {
                currentIndex = imageQueue.length - 1;
            }
            renderGallery();
            manageAnimationLoop();
            renderCurrentImage();
            updateGlobalStatus();
        }

        // Retouch Brush Setup
        brushToggle.addEventListener('change', () => {
            isBrushActive = brushToggle.checked;
            if (isBrushActive) {
                brushControls.classList.remove('hidden');
                brushCursor.style.display = 'block';
                canvas.style.cursor = 'none';
            } else {
                brushControls.classList.add('hidden');
                brushCursor.style.display = 'none';
                canvas.style.cursor = 'default';
            }
        });

        btnErase.addEventListener('click', () => {
            brushMode = 'erase';
            btnErase.style.backgroundColor = '#dc3545';
            btnRestore.style.backgroundColor = '#6c757d';
            brushCursor.style.borderColor = '#dc3545';
        });

        btnRestore.addEventListener('click', () => {
            brushMode = 'restore';
            btnRestore.style.backgroundColor = '#28a745';
            btnErase.style.backgroundColor = '#6c757d';
            brushCursor.style.borderColor = '#28a745';
        });

        brushSize.addEventListener('input', () => {
            brushRadius = parseInt(brushSize.value, 10);
            brushSizeVal.textContent = `${brushRadius}px`;
            updateBrushCursor();
        });

        function updateBrushCursor() {
            const rect = canvas.getBoundingClientRect();
            const scale = rect.width / (canvas.width || 1);
            const size = (brushRadius * 2) * scale;
            brushCursor.style.width = `${Math.max(size, 6)}px`;
            brushCursor.style.height = `${Math.max(size, 6)}px`;
        }

        function saveUndoSnapshot(item) {
            if (!item || !item.maskCanvas) return;
            if (item.isAnimated && item.frames) {
                const snaps = item.frames.map(f => {
                    const sc = document.createElement('canvas');
                    sc.width = f.maskCanvas.width;
                    sc.height = f.maskCanvas.height;
                    sc.getContext('2d').drawImage(f.maskCanvas, 0, 0);
                    return sc;
                });
                item.undoStack.push(snaps);
            } else {
                const snap = document.createElement('canvas');
                snap.width = item.maskCanvas.width;
                snap.height = item.maskCanvas.height;
                snap.getContext('2d').drawImage(item.maskCanvas, 0, 0);
                item.undoStack.push(snap);
            }
            if (item.undoStack.length > 6) {
                item.undoStack.shift();
            }
            updateButtonStates();
        }

        function undoLastStroke() {
            const item = imageQueue[currentIndex];
            if (!item || !item.maskCanvas || !item.undoStack || item.undoStack.length === 0) return;
            const prev = item.undoStack.pop();
            if (item.isAnimated && Array.isArray(prev)) {
                item.frames.forEach((f, idx) => {
                    if (prev[idx]) {
                        const mCtx = f.maskCanvas.getContext('2d');
                        mCtx.clearRect(0, 0, f.maskCanvas.width, f.maskCanvas.height);
                        mCtx.drawImage(prev[idx], 0, 0);
                    }
                });
            } else {
                const mCtx = item.maskCanvas.getContext('2d');
                mCtx.clearRect(0, 0, item.maskCanvas.width, item.maskCanvas.height);
                mCtx.drawImage(prev, 0, 0);
            }
            renderCurrentImage();
        }

        btnUndoMask.addEventListener('click', undoLastStroke);

        window.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
                const item = imageQueue[currentIndex];
                if (item && item.undoStack && item.undoStack.length > 0) {
                    e.preventDefault();
                    undoLastStroke();
                }
            }
        });

        btnResetMask.addEventListener('click', async () => {
            const item = imageQueue[currentIndex];
            if (!item || !item.maskCanvas) return;
            saveUndoSnapshot(item);
            if (item.isAnimated && item.frames) {
                for (const f of item.frames) {
                    if (f.maskBlob) {
                        f.maskCanvas = await buildFullResMaskCanvas(f.origCanvas, f.maskBlob);
                    }
                }
                item.maskCanvas = item.frames[0].maskCanvas;
            } else if (item.maskBlob) {
                item.maskCanvas = await buildFullResMaskCanvas(item.originalImg, item.maskBlob);
            }
            renderCurrentImage();
        });

        // Brush Event Handlers
        canvas.addEventListener('contextmenu', (e) => {
            if (isBrushActive) e.preventDefault();
        });
        canvas.addEventListener('mouseenter', () => {
            if (isBrushActive) brushCursor.style.display = 'block';
        });
        canvas.addEventListener('mouseleave', () => {
            brushCursor.style.display = 'none';
            isPainting = false;
            lastPaintPoint = null;
        });
        window.addEventListener('mouseup', () => {
            isPainting = false;
            lastPaintPoint = null;
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isBrushActive) return;
            const wrapRect = canvasWrap.getBoundingClientRect();
            brushCursor.style.left = `${e.clientX - wrapRect.left}px`;
            brushCursor.style.top = `${e.clientY - wrapRect.top}px`;
            updateBrushCursor();

            if (isPainting && currentIndex !== -1) {
                const isRightHeld = (e.buttons & 2) !== 0;
                applyBrushStroke(e.clientX, e.clientY, e.shiftKey || isRightHeld);
            }
        });

        canvas.addEventListener('mousedown', (e) => {
            if (!isBrushActive || currentIndex === -1) return;
            const item = imageQueue[currentIndex];
            if (!item || item.status !== 'done' || !item.maskCanvas) return;
            saveUndoSnapshot(item);
            isPainting = true;
            lastPaintPoint = null;
            applyBrushStroke(e.clientX, e.clientY, e.shiftKey || e.button === 2);
        });

        canvas.addEventListener('touchstart', (e) => {
            if (!isBrushActive || currentIndex === -1 || e.touches.length === 0) return;
            const item = imageQueue[currentIndex];
            if (!item || item.status !== 'done' || !item.maskCanvas) return;
            saveUndoSnapshot(item);
            isPainting = true;
            lastPaintPoint = null;
            const touch = e.touches[0];
            const wrapRect = canvasWrap.getBoundingClientRect();
            brushCursor.style.display = 'block';
            brushCursor.style.left = `${touch.clientX - wrapRect.left}px`;
            brushCursor.style.top = `${touch.clientY - wrapRect.top}px`;
            updateBrushCursor();
            applyBrushStroke(touch.clientX, touch.clientY, false);
            e.preventDefault();
        });

        canvas.addEventListener('touchmove', (e) => {
            if (!isBrushActive || !isPainting || e.touches.length === 0) return;
            const touch = e.touches[0];
            const wrapRect = canvasWrap.getBoundingClientRect();
            brushCursor.style.left = `${touch.clientX - wrapRect.left}px`;
            brushCursor.style.top = `${touch.clientY - wrapRect.top}px`;
            applyBrushStroke(touch.clientX, touch.clientY, false);
            e.preventDefault();
        });

        canvas.addEventListener('touchend', () => {
            isPainting = false;
            lastPaintPoint = null;
            brushCursor.style.display = 'none';
        });

        function paintStrokeOnMask(maskCanvas, origSource, prev, x, y, shouldRestore) {
            const mCtx = maskCanvas.getContext('2d');
            const dist = Math.hypot(x - prev.x, y - prev.y);
            const step = Math.max(1, brushRadius * 0.25);
            const steps = Math.max(1, Math.ceil(dist / step));

            mCtx.save();
            mCtx.beginPath();
            for (let s = 0; s <= steps; s++) {
                const t = s / steps;
                const ix = prev.x + (x - prev.x) * t;
                const iy = prev.y + (y - prev.y) * t;
                mCtx.moveTo(ix + brushRadius, iy);
                mCtx.arc(ix, iy, brushRadius, 0, Math.PI * 2);
            }

            if (shouldRestore) {
                mCtx.clip();
                mCtx.globalCompositeOperation = 'source-over';
                mCtx.drawImage(origSource, 0, 0);
            } else {
                mCtx.globalCompositeOperation = 'destination-out';
                mCtx.fill();
            }
            mCtx.restore();
        }

        function applyBrushStroke(clientX, clientY, isRestoreModifier) {
            const item = imageQueue[currentIndex];
            if (!item || !item.maskCanvas) return;

            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const x = (clientX - rect.left) * scaleX;
            const y = (clientY - rect.top) * scaleY;
            const prev = lastPaintPoint || { x, y };
            const shouldRestore = isRestoreModifier || brushMode === 'restore';

            if (item.isAnimated && item.frames) {
                item.frames.forEach(f => {
                    if (f.maskCanvas) {
                        paintStrokeOnMask(f.maskCanvas, f.origCanvas, prev, x, y, shouldRestore);
                    }
                });
            } else {
                paintStrokeOnMask(item.maskCanvas, item.originalImg, prev, x, y, shouldRestore);
            }

            lastPaintPoint = { x, y };
            renderCurrentImage();
        }

        // Background Controls
        bgType.addEventListener('change', () => {
            colorGroup.classList.add('hidden');
            customBgGroup.classList.add('hidden');
            blurGroup.classList.add('hidden');
            if (bgType.value === 'color') colorGroup.classList.remove('hidden');
            if (bgType.value === 'image') customBgGroup.classList.remove('hidden');
            if (bgType.value === 'blur') blurGroup.classList.remove('hidden');
            renderCurrentImage();
        });

        bgColor.addEventListener('input', renderCurrentImage);
        blurAmount.addEventListener('input', () => {
            blurVal.textContent = `${blurAmount.value}px`;
            renderCurrentImage();
        });

        customBgInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
                const img = new Image();
                img.onload = () => { customBgImage = img; renderCurrentImage(); };
                img.src = evt.target.result;
            };
            reader.readAsDataURL(file);
        });

        // Input & Clipboard Event Listeners
        imgInput.addEventListener('change', (e) => {
            addFilesToQueue(Array.from(e.target.files));
            imgInput.value = '';
        });

        window.addEventListener('paste', (e) => {
            const items = e.clipboardData?.items;
            if (!items) return;
            const files = [];
            for (const item of items) {
                if (item.type && item.type.startsWith('image/')) {
                    const blob = item.getAsFile();
                    if (blob) {
                        const ext = blob.type === 'image/gif' ? 'gif' : 'png';
                        const file = new File([blob], `pegado_${pasteCounter++}.${ext}`, { type: blob.type });
                        files.push(file);
                    }
                }
            }
            if (files.length > 0) addFilesToQueue(files);
        });

        window.addEventListener('dragover', (e) => e.preventDefault());
        window.addEventListener('drop', (e) => {
            e.preventDefault();
            const files = Array.from(e.dataTransfer.files).filter(f => f && ((f.type && f.type.startsWith('image/')) || /\.gif$/i.test(f.name || '')));
            if (files.length > 0) addFilesToQueue(files);
        });

        // Export Helper Function
        function getExportBlob(item, mimeOverride) {
            return new Promise((resolve) => {
                const mimeType = mimeOverride || exportFormat.value;
                const w = item.originalImg.naturalWidth || item.originalImg.width;
                const h = item.originalImg.naturalHeight || item.originalImg.height;

                // If exporting as GIF (or item is an animated GIF and no override was forced)
                if (mimeType === 'image/gif') {
                    if (item.isAnimated && item.frames && item.frames.length > 1) {
                        const composedFrames = item.frames.map(f => {
                            const c = document.createElement('canvas');
                            c.width = w;
                            c.height = h;
                            renderCompositeOnto(c.getContext('2d'), w, h, f.origCanvas, f.maskCanvas || f.origCanvas, false);
                            return { canvas: c, delayMs: f.delayMs };
                        });
                        resolve(encodeAnimatedGIF(composedFrames));
                        return;
                    } else {
                        const c = document.createElement('canvas');
                        c.width = w;
                        c.height = h;
                        renderCompositeOnto(c.getContext('2d'), w, h, item.originalImg, item.maskCanvas, false);
                        resolve(encodeAnimatedGIF([{ canvas: c, delayMs: 100 }]));
                        return;
                    }
                }

                const exportCanvas = document.createElement('canvas');
                exportCanvas.width = w;
                exportCanvas.height = h;
                const eCtx = exportCanvas.getContext('2d');

                const activeMask = (item.isAnimated && item.frames)
                    ? (item.frames[currentFrameIdx % item.frames.length].maskCanvas)
                    : item.maskCanvas;
                const activeOrig = (item.isAnimated && item.frames)
                    ? (item.frames[currentFrameIdx % item.frames.length].origCanvas)
                    : item.originalImg;

                renderCompositeOnto(eCtx, w, h, activeOrig, activeMask, mimeType === 'image/jpeg');
                exportCanvas.toBlob(resolve, mimeType, 0.95);
            });
        }

        // Action Buttons
        copyBtn.addEventListener('click', async () => {
            const item = imageQueue[currentIndex];
            if (!item || item.status !== 'done' || !item.maskCanvas) return;
            try {
                const blob = await getExportBlob(item, 'image/png');
                await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
                const originalText = copyBtn.textContent;
                copyBtn.textContent = 'Copiado';
                setTimeout(() => { copyBtn.textContent = originalText; }, 1500);
            } catch (err) {
                console.error('Error al copiar al portapapeles:', err);
                alert('No se pudo copiar la imagen al portapapeles.');
            }
        });

        downloadSingleBtn.addEventListener('click', async () => {
            const item = imageQueue[currentIndex];
            if (!item || item.status !== 'done' || !item.maskCanvas) return;
            const mime = item.isAnimated ? 'image/gif' : exportFormat.value;
            let ext = 'png';
            if (mime === 'image/gif') ext = 'gif';
            if (mime === 'image/jpeg') ext = 'jpg';
            if (mime === 'image/webp') ext = 'webp';

            const blob = await getExportBlob(item, mime);
            const baseName = item.name.replace(/\.[^/.]+$/, "");
            const link = document.createElement('a');
            link.download = `${baseName}_sin_fondo.${ext}`;
            link.href = URL.createObjectURL(blob);
            link.click();
            setTimeout(() => URL.revokeObjectURL(link.href), 1000);
        });

        downloadZipBtn.addEventListener('click', async () => {
            const readyItems = imageQueue.filter(item => item.status === 'done' && item.maskCanvas);
            if (readyItems.length === 0) return;

            const zip = new JSZip();
            downloadZipBtn.disabled = true;
            const originalZipText = downloadZipBtn.textContent;
            downloadZipBtn.textContent = 'Generando ZIP...';

            for (let i = 0; i < readyItems.length; i++) {
                const item = readyItems[i];
                const mime = item.isAnimated ? 'image/gif' : exportFormat.value;
                let ext = 'png';
                if (mime === 'image/gif') ext = 'gif';
                if (mime === 'image/jpeg') ext = 'jpg';
                if (mime === 'image/webp') ext = 'webp';

                const blob = await getExportBlob(item, mime);
                const seq = String(i + 1).padStart(3, '0');
                const baseName = item.name.replace(/\.[^/.]+$/, "");
                zip.file(`${seq}_${baseName}.${ext}`, blob);
            }

            const content = await zip.generateAsync({ type: 'blob' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(content);
            link.download = 'imagenes_sin_fondo.zip';
            link.click();
            setTimeout(() => URL.revokeObjectURL(link.href), 1000);

            downloadZipBtn.disabled = false;
            downloadZipBtn.textContent = originalZipText;
        });

        deleteCurrentBtn.addEventListener('click', () => {
            if (currentIndex !== -1) {
                removeImageAt(currentIndex);
            }
        });

        clearAllBtn.addEventListener('click', () => {
            queueGeneration++;
            activeWorkers = 0;
            if (animTimer) {
                clearTimeout(animTimer);
                animTimer = null;
            }
            imageQueue.forEach(item => {
                if (item.objUrl) URL.revokeObjectURL(item.objUrl);
            });
            imageQueue = [];
            currentIndex = -1;
            imgInput.value = '';
            brushToggle.checked = false;
            isBrushActive = false;
            brushControls.classList.add('hidden');
            brushCursor.style.display = 'none';
            canvas.style.cursor = 'default';
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            canvas.width = 0;
            canvas.height = 0;
            renderGallery();
            updateButtonStates();
            updateGlobalStatus();
        });
    </script>
</body>
</html>
